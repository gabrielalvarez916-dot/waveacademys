    .to(slot[2], { attr: { stroke: '#7FD3C4', 'stroke-width': 12 }, duration: .3 }, 53.2)
    .to(slot[2], { attr: { stroke: '#2c5a5e', 'stroke-width': 6 }, duration: .4 }, 57)
    .fromTo(slot[2], { scale: 1, transformOrigin: '50% 50%' }, { scale: 1.08, duration: .4, yoyo: true, repeat: 3, ease: 'sine.inOut' }, 53.3)

  // 5 · cierre
    .set('#cierre', { opacity: 1 }, 58)
    .fromTo('#c1', { opacity: 0, x: -900 }, { opacity: 1, x: 0, duration: .6, ease: 'back.out(1.6)' }, 58.1)

  window.ESCENA = tl; // para grabarla a MP4 cuadro por cuadro
  var voz = $('voz');
  function loop() { if (!voz.paused && !voz.ended) { tl.time(tAnim(voz.currentTime)); requestAnimationFrame(loop); } else if (voz.ended) tl.play(); }
  $('go').onclick = function () { $('ui').remove(); if (V && voz) { voz.currentTime = 0; voz.play().then(loop, function () { tl.play(0); }); } else tl.play(0); };
  $('pp').onclick = function () {
    if (V && voz && !voz.ended) { if (voz.paused) { voz.play(); loop(); } else voz.pause(); $('pp').textContent = voz.paused ? '▶' : '❚❚'; }
    else { tl.paused(!tl.paused()); $('pp').textContent = tl.paused() ? '▶' : '❚❚'; }
  };
