al de hoy."]},{"t":"barras","titulo":"POBLACIÓN DE ARGENTINA (CENSOS)","unidad":"millones","items":[{"txt":"1914","valor":8},{"txt":"1960","valor":20},{"txt":"2010","valor":40},{"txt":"2022","valor":46}],"voz":["También usamos *datos*: números que se pueden comparar, como los de un *censo*.","En 1914, Argentina tenía unos *ocho millones* de habitantes.","En 1960, unos *veinte*.","En 2010, unos *cuarenta*.","Y en el censo de 2022, unos *cuarenta y seis millones*."]},{"t":"definicion","palabra":"Contrastar fuentes","texto":"Comparar varias fuentes y preguntarse quién la hizo, cuándo y para qué","emoji":"⚖️","voz":["Ninguna fuente dice toda la verdad: cada una tiene un *autor* con una mirada y una intención.","Por eso se *contrastan*: se comparan varias y se pregunta quién la hizo, cuándo y para qué."]},{"t":"pregunta","pregunta":"Un diario de 1890 elogia a un gobernador. ¿Qué conviene hacer?","opciones":["Creerle todo","Compararlo con otras fuentes de la época","Descartarlo"],"correcta":1,"voz":["Te toca: un diario de 1890 elogia muchísimo a un gobernador. ¿Qué conviene hacer?","¿creerle todo, compararlo con otras fuentes de la época, o descartarlo?","*Compararlo con otras fuentes*: quizás el diario era amigo del gobernador. No se descarta: también nos dice qué pensaban algunos."]},{"t":"resumen","voz":["Repasemos.","*Primarias*: de la época.","*Secundarias*: posteriores, que las analizan.","Escritas, materiales, orales e iconográficas.","Y siempre, *contrastar*.","¡Clase terminada! Ahora, *a practicar*."],"items":[["PRIMARIAS","de la época"],["SECUNDARIAS","posteriores"],["TIPOS","escritas, materiales, orales, imágenes"],["CONTRASTAR","quién, cuándo, para qué"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAAD1B//2elZsW07m7HtizkQ48YTh/83cuDI2k/0mAyOm1+2jIyTSfm0mA///+0n6aTXtJ/aTRkZJteSbQwKiuzP+zOiopijjkPqYruzp/6K7Mcn/opmHHIW/S6qoZGB72YhbFrJmTspmGj9MdpXB9MECmMDG1jIDLAbBzeDg74FkhkoyX//NkxIMWi7GcDDBFPcb4yWDM
