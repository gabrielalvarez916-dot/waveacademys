esarla.","Una *gota* de agua o de colorante.","El *cubreobjetos*, apoyado de costado para que no queden burbujas.","Se enfoca *siempre con el menor aumento*.","Y recién después se pasa a un aumento mayor."]},{"t":"pregunta","pregunta":"Ocular 10× y objetivo 40×: ¿cuál es el aumento total?","opciones":["400×","50×","4000×"],"correcta":0,"voz":["Te toca: ocular de diez y objetivo de cuarenta. ¿Aumento total?","¿Cuatrocientos, cincuenta, o cuatro mil?","*Cuatrocientos*: se multiplica, diez por cuarenta. Sumar daría cincuenta: ese es el error típico."]},{"t":"errores","items":[{"mal":"Sumar los aumentos","bien":"Multiplicarlos"},{"mal":"Empezar con el mayor aumento","bien":"Empezar con el menor"}],"voz":["Errores típicos.","*Sumar* los aumentos en lugar de multiplicarlos.","Y empezar con el *mayor aumento*: así es casi imposible encontrar la muestra."]},{"t":"resumen","voz":["Repasemos.","Partes: *ocular, objetivos, platina, tornillos y luz*.","*Aumento total*: ocular por objetivo.","La muestra, *fina* y con cubreobjetos.","Y se enfoca *del menor al mayor aumento*.","¡Misión 3 terminada! Ahora, *a practicar*."],"items":[["PARTES","ocular, objetivos, platina"],["AUMENTO","ocular × objetivo"],["MUESTRA","fina, con cubreobjetos"],["ENFOQUE","del menor al mayor"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAAGI+VhhYtHSsooYYWIdKymOMZGTTaYDL//+m1/yMgtMydLP/lisQ46OlZRQwwsQWjC1lsVg9UjBWVA6Ri6Mj/qq+qokqnVWf///YKyoHTZftMFZUDpkXZpkWVI0+ujpkWVVVALJ6NHCDXrxCru7u4s+u6E58QuIT+giufxz3f4juaJxC//NkxIMYUb1UABhHEfd8v0IO8T47n+/9frnXJzzhflXQn8IACC0REFnuabx4iITn1zSu///ETiVz3dy3867l7v13EU/hgYAIw9/4CCKcu8PPwADMNRw8//ZDzx3+6RUCSa5TtyGLDG/YS4IgaTCyaaeY8jikkWNupia0wpt6OrMyoMvKABkXO3GyhFZFtDFs//NkxKQckyIAADhGQRi48oSSRWHzumD2TK5P3KtdpLe2zchBjkSdRZeX8irpGCWoFQ6yFBRzGWQr0kMRSxsKUzqrkucQuTS4wxEsoj06KKNPPSZ2FkS455EubLT06lcOfeci+s+JMc7gNRAhRpTgApycFuo+zFyZysp3Oy/MSfJfcp8SyDnVCFDcTklbjjmH//NkxLQqlDoAAGPMBEq3i71dr2PQ8p7VKdEec0JOMdHWqoxZaEDqx
