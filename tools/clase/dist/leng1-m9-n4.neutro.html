a su propio camino","emoji":"🎒"},"signo":"→","voz":["¿Y qué quedó de todo eso?","El héroe épico es casi perfecto: representa a su pueblo y busca la gloria.","El héroe de los relatos actuales tiene dudas, miedos y defectos, y muchas veces busca su propio camino más que la fama."]},{"t":"prediccion","pregunta":"Una saga actual: un chico deja su pueblo, enfrenta pruebas, recibe ayuda de un mentor y vuelve cambiado. ¿Tiene algo de épica?","a":{"txt":"Nada que ver","emoji":"🙅"},"b":{"txt":"Sí: el viaje del héroe","emoji":"🗺️"},"correcta":"b","resultado":"Repite la estructura de partida, pruebas, ayuda y regreso.","voz":["¿Qué crees? En una saga actual, un chico deja su pueblo, enfrenta pruebas, recibe ayuda de un mentor y vuelve cambiado. ¿Tiene algo de épica?","Piensa en Odiseo.","Sí: repite el *viaje del héroe*. Muchas películas, novelas y videojuegos de hoy usan esa estructura milenaria."]},{"t":"logro","titulo":"¡Misión cumplida!","items":["El héroe épico y sus epítetos","El viaje y las pruebas","Dioses, destino y fama","La épica en el tiempo"],"xp":100,"voz":["¡Terminaste las clases de la misión!","Ya conoces al héroe épico y sus epítetos.","El viaje y sus pruebas.","El papel de los dioses, el destino y la fama.","Y cómo la épica llega hasta los relatos de hoy. ¡A practicar!"]}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAAKlprEEjTJlYYccYyMjGd0eWKZDGCYqw2ZFWGjP///////sm3CqDRl3//+YNCwmMmgsLBswDgsJjJoHBbf+ZMDhZJk0aMkNtro2kBoWYkAEGBDQukDMsxROgGZDAWcI6AfeoMB+GcmQLg+ovOHy+OL5SGFH1AgNA4fl8oERzg/wfghdI//NkxIMRAHWVhgjGBE4Xy7yAPrD8Qdiw/cUsPlCg0p2Dz6gwOAiS47lHQQiABvLicCAQBhNwFsWsYAiTZIwuujbTUgSoDYngQiM0iIkRlJT4ZlSJzhcyQoWRT4pnN85olpm7YjL8vMkMQnQgJlCX+c0iHxDcLCFwfDhqwRX8GHByuPCrMGRY8rIjKHCRCCa4//NkxMIZeGYUCkmMKJTdTKP3e5O5nYdPkydnPpnjK8MsKf7vp7nLChEELKfmYQjQoms0puEpQStXX5PFgzQBgIWUB6X5ayJNdN4M37O8H+/8O02J7EXsQ/Gq/kUPST+doCFFFNZb3L6v+l/K6eai1GLrdFTv/LHSBuM0eeQCfla/oHxDU5ZucmduEr9z1hRT//NkxN8hfCoUAHpGEVkVVbi+d/3n//XuvbpVIL57iQEJDLLmhbMayjUqrdtc0OPasktosaNRzmMrCFFI7uYvcEM75IgLqPhETp
