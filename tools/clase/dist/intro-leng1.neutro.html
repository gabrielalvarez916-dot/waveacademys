lizar cualquier oración completa."]},{"t":"pasos","titulo":"CÓMO SE JUEGA CADA NIVEL","items":[{"txt":"Mira la clase animada","emoji":"🎬"},{"txt":"Haz la lección interactiva","emoji":"🧠"},{"txt":"Practica con las actividades","emoji":"🧩"},{"txt":"En algunas misiones, lee el libro del nivel","emoji":"📖"}],"voz":["¿Cómo se juega? Cada misión tiene *niveles*.","Primero miras una *clase animada*, como esta.","Después haces la *lección interactiva*: explica, te muestra ejemplos paso a paso y te hace practicar.","Y resuelves las *actividades* para sumar puntos.","En algunas misiones hay un *libro del nivel*: lo bajás desde el principio de la misión, lo lees y al final haces sus actividades. Este año lees *La liga de los pelirrojos* y *El fantasma de Canterville*."]},{"t":"frase","texto":"Al final de cada misión te espera el NIVEL JEFE","emoji":"👑","color":"#F4B63F","voz":["Y al final de cada misión te espera el *nivel jefe*: el desafío para pasar a la siguiente."]},{"t":"consejo","titulo":"UN CONSEJO","texto":"Lee todos los días, aunque sean diez minutos","emoji":"📚","voz":["Un consejo: *lee todos los días*, aunque sean diez minutos. Así se forma un gran lector."]},{"t":"frase","texto":"Misión 1: la comunicación. ¡Vamos!","emoji":"🚀","voz":["¿Listo? Tu primera misión te espera: *la comunicación y el lenguaje*. ¡Vamos!"]}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAAGmWmUSEmHQmHQgJyRthswTtwnC6i05z2G4TycM//Taf9/+ZBEm0MBl0//7Taa9tPtNp//6XI6b5kmkwGXbT///+ZGf/+RGR1lHEDGjyxTMnlimRPLFYhxxnCLJl2YfmjP8yEDApAbfaOSC9QNIIsAKBmiEYRG8cPIv8sIgR3/4f7v////NkxIMYe5FsAEhHPI7SNJ//Png6BmARw/jmT2Tx8nvMEYAH//iMz8HH/wzwzMfY/D8P//8wQP7hqoikd5E/8HXEfHH4eJ6/xBjXADx+o/x5B4AJAMw/VQk4wBADhMODQyJm0TZzzSaEnuz2WHnyTg2wSBMsqPKfYEW5PYLMrqCXRB7Jd4LLvk5UobnymKY3//NkxKQa2FoYNEjGYSDqYo3YIgMzIoCTfuaEYOUJjqli4KZ/mWxHErbhBFpXkqJISEnIViQi0QHwom+iG6o5zJt5FLpl74sIQvvEuqg+HulIkEydvJdRJX6iMMN8/7Q5nKaDbftApelsVn/za5FiGUljlaV9KdPc7e5tySOWZZfhxd9CXnW0Rz/5xvBLCk5H//NkxLsgc6oYCGGGMf/7CTOmSUqZv9hGT9SV6YS/X08vP7nAXnF8KTSCDg83
