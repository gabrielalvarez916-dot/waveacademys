ichas":[{"txt":"Volvieron cansados.","caja":0},{"txt":"Llegaste tarde.","caja":0},{"txt":"Anocheció temprano.","caja":1},{"txt":"Hubo tormenta.","caja":1}],"voz":["¿Sujeto tácito o unimembre?","*Tácito*: volvieron cansados, ellos; llegaste tarde, tú.","*Unimembres*: anocheció temprano; hubo tormenta. Nadie hace la acción."]},{"t":"pregunta","pregunta":"\"Hubo varios accidentes en la ruta.\" ¿Qué oración es?","opciones":["Bimembre: sujeto \"varios accidentes\"","Unimembre","Sujeto tácito: ellos"],"correcta":1,"voz":["Te toca: hubo varios accidentes en la ruta. ¿Qué oración es?","¿Unimembre, bimembre con sujeto varios accidentes, o con sujeto tácito?","*Unimembre*. Fíjate que el verbo no cambia: hubo un accidente, hubo varios. Si fuera sujeto, el verbo concordaría."]},{"t":"errores","items":[{"mal":"\"Muchos libros\" es sujeto de hay","bien":"Hay: unimembre"},{"mal":"Tácito = sin sujeto","bien":"Tácito: está escondido"}],"voz":["Errores típicos.","Creer que en *hay muchos libros*, muchos libros es el sujeto.","Y confundir *tácito* con *sin sujeto*: el tácito existe, solo que está escondido."]},{"t":"resumen","voz":["Repasemos.","*Tácito*: se sabe por el verbo.","*Bimembre*: sujeto y predicado.","*Unimembre*: no se puede dividir.","Típicas: el *clima*, *hay* y *hace*.","¡Clase terminada! Ahora, *a practicar*."],"items":[["TÁCITO","se sabe por el verbo"],["BIMEMBRE","sujeto + predicado"],["UNIMEMBRE","no se divide"],["TÍPICAS","clima, hay, hace"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAAHyjKMkJoyLi44bMNueYJ24ThdRac57E4TQwf////9ptP/9NJzLTaa6bT9Nr//aXlYjMnlimRGjy+Zkf+R//mR//5kRkZMQ4gjR5YRmTyxTInSxWIccZwT/QaeaNGQjzNIDVDIYJt3dEC6BEiErISTqIyzCeE4x5n3HiMM2+OP6RPM/4//NkxIMYU5F0AkhHHO0j/9+P/+v+5h5AwiWZPD+GHmQAARb/uAZn8ZHiOO8cHj5Pk/X/5nBEk/4a4ykznM/4jv47MPSKiWX/9sHQP///cg/5REcak1HoKCoCBhAhYdaz0HlkVEaPVWkSoL1fcekoRoGYOaWyAZoHs6SIJFNKIqhKRNuc1rUoJqRHu5xfg7MI//NkxKQZwHIYKkmGFTQhO0BQXiyRDDI6zr1oNruEYL93jzQt47IRsg
