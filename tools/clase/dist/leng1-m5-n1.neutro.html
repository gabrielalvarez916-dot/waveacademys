ierde: era la principal","emoji":"🎯"}],"voz":["Un truco para no equivocarte.","Tacha una oración con la imaginación.","Fíjate si el párrafo deja de entenderse.","Si se pierde el sentido, era la *idea principal*."]},{"t":"clasificar","cajas":[{"cab":"PRINCIPAL","emoji":"⭐"},{"cab":"SECUNDARIA","emoji":"➕"}],"fichas":[{"txt":"Vuelan","caja":0},{"txt":"Alas de piel","caja":1},{"txt":"Usan el eco","caja":1}],"voz":["Probemos con los murciélagos.","*Principal*: son los únicos mamíferos que vuelan.","*Secundarias*: cómo son sus alas y cómo se orientan."]},{"t":"tabla","titulo":"DÓNDE ESTÁ LA IDEA PRINCIPAL","columnas":["Lugar","Cómo se nota"],"filas":[["Al principio","La primera oración"],["Al final","Los datos llevan a ella"],["Escondida","La armas tú"]],"voz":["Ojo: la idea principal no siempre está en el mismo lugar.","A veces, *al principio*: la primera oración.","A veces, *al final*: los datos llevan a ella.","Y otras, *escondida*: no está escrita y la armas tú."]},{"t":"pregunta","pregunta":"\"La Luna es el único satélite natural de la Tierra. Tarda casi un mes en dar una vuelta. Tiene cráteres.\" ¿Cuál es la idea principal?","opciones":["Tiene cráteres","La Luna es el único satélite natural de la Tierra","Tarda casi un mes"],"correcta":1,"voz":["Te toca: ¿cuál es la idea principal sobre la Luna?","¿Tiene cráteres, es el único satélite natural de la Tierra, o tarda casi un mes?","*Es el único satélite natural de la Tierra*: es lo que dice qué es. Lo demás son detalles."]},{"t":"errores","items":[{"mal":"Tema = idea principal","bien":"El tema dice de qué trata"},{"mal":"Lo llamativo es lo principal","bien":"Principal es lo que no se puede sacar"}],"voz":["Errores típicos.","Confundir el *tema* con la *idea principal*.","Y pensar que lo más llamativo es lo principal."]},{"t":"resumen","voz":["Repasemos.","El *tema*: de qué trata.","La *idea principal*: lo más importante que dice.","Las *secundarias*: explican y suman datos.","Y la *prueba del borrado* te ayuda a encon
