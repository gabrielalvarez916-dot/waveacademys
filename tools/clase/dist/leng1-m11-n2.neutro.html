<script>window.CLASE={"slug":"leng1-m11-n2","step_id":"c0284020-79da-452d-a4a3-0839c75df444","materia":"Lengua y Literatura I","titulo":"Mundos posibles","sub":"Lengua y Literatura I · Misión 11 · Nivel 2","escenas":[{"t":"noticia","cinta":"AÑO 2190","titular":"En Neo Córdoba está prohibido estar triste","bajada":"Un sensor en la muñeca avisa a las autoridades","emoji":"🙂","titulo":"MUNDOS POSIBLES","sub":"utopías y distopías","voz":["Noticia del año 2190: en la ciudad de Neo Córdoba está prohibido estar triste.","Un sensor en la muñeca de cada habitante avisa a las autoridades si alguien deja de sonreír.","¿Es un mundo perfecto o una pesadilla? La ciencia ficción construye *mundos posibles* para hacernos esa pregunta."]},{"t":"definicion","palabra":"Mundo posible","texto":"Lugar imaginado, con sus propias reglas, tecnologías y costumbres, donde ocurre un relato de ciencia ficción.","emoji":"🌐","voz":["Un *mundo posible* es el lugar imaginado donde transcurre el relato: con sus propias reglas, tecnologías y costumbres.","Puede ser la Tierra dentro de mil años, otro planeta o una ciudad bajo el mar."]},{"t":"versus","a":{"txt":"Utopía","emoji":"🌈","datos":["sociedad ideal","todos viven en armonía"]},"b":{"txt":"Distopía","emoji":"🏭","datos":["sociedad opresiva","el control parece perfecto"]},"gana":"empate","veredicto":"Dos caras del futuro","voz":["Hay dos grandes tipos de mundos posibles.","La *utopía*: una sociedad ideal, donde todos viven en armonía.","La *distopía*: una sociedad que parece perfecta, pero en realidad controla y oprime a las personas.","Neo Córdoba, con su sensor de sonrisas, es una distopía."]},{"t":"bloques","titulo":"CÓMO SE ARMA UN MUNDO","items":[{"cab":"Las reglas","txt":"qué se permite, qué se prohíbe"},{"cab":"La tecnología","txt":"qué inventos cambian la vida"},{"cab":"Las costumbres","txt":"cómo viven y se relacionan"}],"voz":["¿Cómo se construye un mundo posible?","Con sus *reglas*: qué está permitido y qué prohibido.","Con su *tecnología*: los inventos que cambiaron la vida.","Y con sus *costumbres*: cómo se visten, se comunican y se relacionan."]},{"t":"prediccion","pregunta":"En un mundo sin gravedad, un personaje deja caer un vaso y se rompe contra el piso. ¿Funciona el relato?","a":{"txt":"Sí, da igual","emoji":"🤷"},"b":{"txt":"No: rompe sus propias reglas","emoji":"❌"},"correcta":"b","resultado":"Un mundo posible tiene que ser coherente con las reglas que planteó.","voz":["¿Qué crees? En un relato ambientado en un mundo sin gravedad, alguien deja caer un vaso y se rompe contra el piso.","Piénsalo.","No funciona: el relato rompe sus propias reglas. Un mundo posible tiene que ser *coherente*."]},{"t":"vof","afirmacion":"Las distopías son mundos que los personajes viven como perfectos, aunque esconden un control opresivo.","emoji":"👁️","verdadero":true,"explicacion":"La apariencia de perfección esconde la falta de libertad.","voz":["Verdadero o falso: las distopías suelen parecer perfectas, aunque esconden un control opresivo.","Piensa en Neo Córdoba.","Verdadero: muchas veces el protagonista es el primero en darse cuenta de que algo anda mal."]},{"t":"errores","items":[{"mal":"Un mundo posible puede cambiar sus reglas cuando conviene","bien":"Tiene que ser coherente de principio a fin"},{"mal":"Distopía es cualquier mundo triste","bien":"Es una sociedad de control que se presenta como ideal"}],"voz":["Dos errores comunes.","Cambiar las reglas del mundo cuando conviene: el lector deja de creer.","Y llamar distopía a cualquier mundo triste: la distopía es una sociedad de *control* que se presenta como ideal."]},{"t":"resumen","items":[["Mundo posible","lugar imaginado con sus reglas"],["Utopía","sociedad ideal"],["Distopía","sociedad opresiva que parece perfecta"],["Coherencia","respetar las propias reglas"]],"fin":{"titulo":"¡A practicar!","sub":"Nivel 2"},"voz":["Repasemos.","Los mundos posibles son espejos de nuestro mundo.","El mundo posible.","La utopía.","La distopía.","Y la coherencia. ¡A practicar!"]}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAAAJqampSRDhww9DcWgmnFw5UpKUmhcO07uXDtO5mwZabT//7X/+0mvtr////+mk0ZHTaGRkmk1//////kmIEC0eVhI44h0sUUMMLR4rCRxxAtAs1Br8yYHCyTJo0MQIDTPJ0QlNqBFMQkLpAzLMQyQ1AhkCB+Yx8CG+/Nkpj8eCyjff4//NkxIMW+5V4BDBHXNgWAjdAgRfxPiDE47Ln8oQPnBAsCAMQCcmsu8pIJKCAus+icAgDcxCgg7ieUcRw/OW6nKOA/E58MnD5dFVJhhEZgDh/ZxjmfhbfcOg0YhB6FAnHMoeVQjHu5A+EX+IIuIWV0U/gG4s34QNHfMGf/5bEjlm7wUHMlKm5OR2balmcf2X6//NkxKoYyaIYDDBE3GW72bnL5yKTI54M7sukN5lfSc1A/8PRtEdhJfelD3oR9ftABi3Y57T7Wz+c/K90j+I9wThThYWEA4xCQJZyOMTzUORMnvhy46pzekZptNabT33eRIW/mF5nr32acIjpFkZk0I4X+3Ot9yOmhnF8sjdeSSa5qfTep5p8th8Ipclz/z2s//NkxMkdqo4gUmBGYble/3PJOZ9nZf8tsqXPGCU6DVYYKoVVe9TXXXEKEcrADgdDcUCwkEShveFInl34WL06mzbkFKynV2No11XPMikYVRyFWhfO6tIpdqLMJiIKYjmKdHZnV1RfZd2WpqMqmrJc60ZpFY7tN05nn0rmUtnIlCEVkRJZHTys5tLSrFiT57Ul//NkxNUbo4IkAHmGFHKx6ESWNYhlPMshntKYpUMubdKCBe5N3K1AFzwMAGYUYZICEeMLk+k1HwTn7ZeYHgFBQCuZXgyBkcgEy+qYBgAjSyIRRaRfqHKIgYgLrgCrgdOtbsXzYnDwFgwGOFAJBhilqlLOFQtJpBaMIChZCCA0BrjD2TxS4uQtDgJtIDOQAMgX//NkxOkfrBIoC0woAQNmXBENJQ0V+ggxfL5XIoNMgjECAIDAKBBs/10GZky4tyDjNlcnjQwOl0fBEK1dSCbZugfLho2YKaKWIuLmNyKtOF0vnG1rr/7X2LmpqadNNEwJQcwh5N1G9AvGBbLY8Vf/+6s3ZTIfW+utaSWWCAGpNjQKZnRN2UmmcNGNjQ4TbAAD//NkxO06vDpACZ6gAJyWJ6627bdFFzYq2vBSbFE8s9nIMcHcRvfyrLPh6KMwb/CWP0yXsTg1FKIcagp4jByoVZFv2pX3OuG6j2cKK5ojHA8HWmR2Q21qhwKV6kJ23pxgenHIyoWpiwQ2VzSBNDnCDvxbDTYEXZk3DpR/T6lj4lvAj7/+qWzfTVWDu2d33/////NkxIU1HDK+X9h4A///X3n6/z//6a/8O+Nff3amN5pSmb/W/vGbyRM3p6Zvimf8U1nwq+fe80dwV6Owq3TNF1PBxvG/j71ref87x/T/+Ji/x/ffltib6xiJK/GVAAdjbRLd21/3HlxjN/43hJLGSOGachEwKAUjIZiEYPxNPpi+k88bzTrE78ftXr2e81PP//NkxDMpNDriXsCRNt+6rls6H/JJXpRkeHMU6O6f3IzEkIjfs5lh2er07GLdXLv/LuLlllnmClJHdF0g5BRA4oYLlTbEGCgiiGH40Xh2pyylPoXl0MGjJPy7mtPT6/Suv/////3hJQtpau4dFTtKsUkQDTjGD8pw4DkWCgjA0QBggFXejY5ER6ZDyBnrdKop//NkxBEghDrFfsMEqFvkzBxZU3ewqlIWD25figU+ruKbMnHBTsPSpoypU0h1R3Ih49Ntk2q0qqMcCEBHOaSm9MSgeYZ1Rv6lYWJJZSnoRDyMhHPBMp7uY0zoWjEBncAmEiVKhSyasxWYymzMhM7kb////////3/o81WhVBtGChEWTRIUTAi8ZxIxAgaQLby+//NkxBIhAxqgLsGFFANasBMOYlR4T0BO9a/LLc
