e bien una sustancia? Con la mano sobre el recipiente…","… se *abanica* el aire hacia la nariz. Así llega solo un poquito y no hay riesgo."]},{"t":"matriz","voz":["Las *señales de peligro* de las etiquetas.","La *llama*: inflamable, se prende fuego fácil.","La *calavera*: tóxico, es veneno.","La mano corroída: *corrosivo*, quema la piel.","La explosión: *explosivo*."],"titulo":"SEÑALES DE PELIGRO","celdas":[{"cab":"🔥 INFLAMABLE","txt":"se prende fácil"},{"cab":"☠️ TÓXICO","txt":"veneno"},{"cab":"🧪 CORROSIVO","txt":"quema la piel"},{"cab":"💥 EXPLOSIVO","txt":"puede explotar"}]},{"t":"clasificar","voz":["¿Seguro o peligroso?","*Seguro*: usar antiparras, abanicar para oler, atarse el pelo.","*Peligroso*: probar una sustancia, correr en el laboratorio."],"cajas":[{"cab":"SEGURO","emoji":"✅"},{"cab":"PELIGROSO","emoji":"⛔"}],"fichas":[{"txt":"Usar antiparras","caja":0},{"txt":"Abanicar al oler","caja":0},{"txt":"Atarse el pelo","caja":0},{"txt":"Probar sustancias","caja":1},{"txt":"Correr","caja":1}]},{"t":"pregunta","voz":["Te toca: una etiqueta tiene una *llama*. ¿Qué no puedes hacer?","¿Acercarla al mechero, guardarla cerrada, o leer la etiqueta antes de usarla?","¡No acercarla al fuego! Es *inflamable*."],"pregunta":"Etiqueta con llama: ¿qué está prohibido?","opciones":["Acercarla al mechero","Guardarla cerrada","Leer la etiqueta antes de usarla"],"correcta":0},{"t":"errores","voz":["Errores típicos.","Oler un frasco *directo*.","Y *no avisar* un accidente por vergüenza."],"items":[{"mal":"Oler directo","bien":"Abanicar con la mano"},{"mal":"Esconder un vaso roto","bien":"Avisar enseguida"}]},{"t":"resumen","voz":["Repasemos.","*Protección*: antiparras, guardapolvo y guantes.","*Normas*: no probar, abanicar y avisar.","*Señales*: siempre leer la etiqueta.","Y ante la duda, *preguntar*.","¡Clase terminada! Ahora, *a practicar*."],"items":[["PROTECCIÓN","antiparras y guardapolvo"],["NORMAS","no probar, abanicar, avisar"],["SEÑALES","leer la etiqueta"],["ANTE DUDAS","pr
