ichas":[{"txt":"Comimos pizza.","caja":0},{"txt":"Salió temprano.","caja":0},{"txt":"Hace calor.","caja":1},{"txt":"Llovió anoche.","caja":1}],"voz":["¿Sujeto tácito o unimembre?","*Tácito*: comimos pizza, nosotros; salió temprano, él o ella.","*Unimembres*: hace calor; llovió anoche. Nadie hace la acción."]},{"t":"pregunta","pregunta":"\"Hay muchos libros.\" ¿Qué oración es?","opciones":["Unimembre","Sujeto tácito"],"correcta":0,"voz":["Te toca: hay muchos libros. ¿Qué oración es?","¿Unimembre o con sujeto tácito?","¡*Unimembre*! Con *hay* no hay sujeto: muchos libros no es sujeto."]},{"t":"errores","items":[{"mal":"\"Muchos libros\" es sujeto de hay","bien":"Hay: unimembre"},{"mal":"Tácito = sin sujeto","bien":"Tácito: está escondido"}],"voz":["Errores típicos.","Creer que en *hay muchos libros*, muchos libros es el sujeto.","Y confundir *tácito* con *sin sujeto*: el tácito existe, solo que está escondido."]},{"t":"resumen","voz":["Repasemos.","*Tácito*: se sabe por el verbo.","*Bimembre*: sujeto y predicado.","*Unimembre*: no se puede dividir.","Típicas: el *clima*, *hay* y *hace*.","¡Clase terminada! Ahora, *a practicar*."],"items":[["TÁCITO","se sabe por el verbo"],["BIMEMBRE","sujeto + predicado"],["UNIMEMBRE","no se divide"],["TÍPICAS","clima, hay, hace"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAABCAyflTs1KSg4cYPQ3NQTuNZ2msUtC4fZ3Z//2dmdlRXZ3Z//////6KZnciopijjDCyHRUW7P/9nZ3b+ztUxRxAzkORUZ3Y6KhXZjkVCmEjjiBZCyoPigbfhOiBqZBIExiBoDqDMswBiAHFBF9ThAJ5RYf6gxWFjggefGh8ufLgR0MZ//NkxIMVC5WA1DAFDcOH7ajgfIggCDuXEDgfQJ3jT6Yel5NWpyncH5TOCAB1vW/xOXAjo1+cHBgo7Jz5wPnIYg/VDg8BABggCQJ+0Vr4DiB5xEsfXr19Pipmn/zNyafNdoMq7XkPrFnwntePkY1Qq8dBO8tk86ct6t8b+Lj4/zzGa2r1Et9ZtvFw37VGVZ57//NkxLEYiFoYKkmMCGwNp33eVUdwZGLiFXF3ivAhoi1VU+1Pl8J5pm5wvzU0hwnc5hBoE7QRwgQsGRy7psDFJtqDYljp05U3JyOXckW4qxpf0cIyNdAOd1LFeTT/FZwVix14eELJRyApIkh4gQxDHDBS0imtNIeYt9DqiR9jUqQaBJhEFWDWHTLkAbGHmjnR//NkxNEkPCYUAGGHHGW5udQMPpGipWkG3lAq8vT63Maq4L
