esarla.","Una *gota* de agua o de colorante.","El *cubreobjetos*, apoyado de costado para que no queden burbujas.","Se enfoca *siempre con el menor aumento*.","Y recién después se pasa a un aumento mayor."]},{"t":"pregunta","pregunta":"Ocular 10× y objetivo 40×: ¿cuál es el aumento total?","opciones":["400×","50×","4000×"],"correcta":0,"voz":["Te toca: ocular de diez y objetivo de cuarenta. ¿Aumento total?","¿Cuatrocientos, cincuenta, o cuatro mil?","*Cuatrocientos*: se multiplica, diez por cuarenta. Sumar daría cincuenta: ese es el error típico."]},{"t":"errores","items":[{"mal":"Sumar los aumentos","bien":"Multiplicarlos"},{"mal":"Empezar con el mayor aumento","bien":"Empezar con el menor"}],"voz":["Errores típicos.","*Sumar* los aumentos en lugar de multiplicarlos.","Y empezar con el *mayor aumento*: así es casi imposible encontrar la muestra."]},{"t":"resumen","voz":["Repasemos.","Partes: *ocular, objetivos, platina, tornillos y luz*.","*Aumento total*: ocular por objetivo.","La muestra, *fina* y con cubreobjetos.","Y se enfoca *del menor al mayor aumento*.","¡Misión 3 terminada! Ahora, *a practicar*."],"items":[["PARTES","ocular, objetivos, platina"],["AUMENTO","ocular × objetivo"],["MUESTRA","fina, con cubreobjetos"],["ENFOQUE","del menor al mayor"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAABVUFrrKOIEC0dKymOjpWUUMMLEBZtH//+g3zRkaKzf+bcKiE0AwiKhw2AwiKmjIJsxoqQNGQiybMuSZNGjRo27M+YNZqsVDhsBhFiDJmkxzVYqaNgMVIGkSk4cWimEJw4tA4tFeOPnEdRcRrRzPs+JOIH+Ij/zUex/9LEWmEclRg//8//NkxIMV8HmADAjGBEiMBH/4jiBHrB39+cSReWZRn/8sBlpw/r89ycZf//gwy07XUhF+g/up+GfsgjST9d/9HcMw8/+fgZAVHYep5x1X2MujGhNy7MGPMjEG12tuFQkkFB6ZqINLWp9d1gWLApl13Jno7m4sylgK83IkruU3R9qeHl9FO04pUQSsQ80UESVP//NkxK4ZUHoYDBhGoaLBvHEPSixWU0v4hNHvyIw1rk5JI5fxqngwbvd4fS+LmRkbocoohdMnsWO4K8InGNzMQlbYxRjJjYKjVRswgeAIQgDJ15IExRGc/CotyJC4rWAIZBNonmjLBhMeYQJk02IECGPBiH1ydIeyaeuf0NujJDmhJu9fPeFQ5oVhfkf+ifn0//NkxMsg1DIUADDG3dC92SaJTRTeF8T//y0PiSnCzy50zR////5TN
