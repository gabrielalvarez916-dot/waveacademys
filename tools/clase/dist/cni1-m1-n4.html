e más calor, se derrite más rápido.","*Procedimiento*: pusimos un cubito bajo la lámpara y otro sin lámpara.","*Resultados*: con lámpara tardó 6 minutos; sin lámpara, 15."],"cajas":[{"cab":"HIPÓTESIS","emoji":"💡"},{"cab":"PROCEDIMIENTO","emoji":"🧪"},{"cab":"RESULTADOS","emoji":"📊"}],"fichas":[{"txt":"Calor = más rápido","caja":0},{"txt":"Con y sin lámpara","caja":1},{"txt":"6 min contra 15 min","caja":2}]},{"t":"comparar","voz":["La parte más importante: la *conclusión*.","Una conclusión buena *responde la pregunta* y dice si la hipótesis *se confirmó*, usando los datos.","Una mala solo dice \"salió bien\" o repite los resultados."],"a":{"cab":"BUENA","texto":"Se confirmó: 6 min contra 15","emoji":"✅"},"b":{"cab":"MALA","texto":"Salió bien","emoji":"❌"},"signo":"vs"},{"t":"consejo","voz":["Truco: escribí el procedimiento como *una receta*, con pasos numerados. Si alguien lo sigue, tiene que poder repetir tu experimento."],"titulo":"COMO UNA RECETA","texto":"Pasos numerados que otro pueda repetir","emoji":"🧾"},{"t":"errores","voz":["Errores típicos.","*Cambiar la hipótesis* después de ver los resultados: si no se confirmó, se dice, ¡y eso también es ciencia!","Y una conclusión que *no usa los datos*."],"items":[{"mal":"Corregir la hipótesis al final","bien":"Decir si se confirmó o no"},{"mal":"\"Salió bien\"","bien":"Conclusión con datos"}]},{"t":"resumen","voz":["Repasemos.","*Antes*: título, pregunta e hipótesis.","*Cómo*: materiales y procedimiento.","*Después*: resultados y conclusión.","Y la conclusión *responde con datos*.","¡Misión 1 terminada! Ahora, *a practicar*."],"items":[["ANTES","título, pregunta, hipótesis"],["CÓMO","materiales y procedimiento"],["DESPUÉS","resultados y conclusión"],["CONCLUSIÓN","responde con datos"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAADFT/Z3b/6K7O7O3/9+ioV2ZyKiozux0VCmYYWQ6KZndjotnZnbs7N9nZn/isMLHEOlisMMOjpf//8yI+y5GfZYpkTo8rEZo8rKwww4xkZDiDJkz//SZNPo80gWAbN0
