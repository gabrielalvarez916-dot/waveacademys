<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg', $ = function (id) { return document.getElementById(id); };
  var C = { aqua: '#7FD3C4', sol: '#F4B63F', coral: '#ff7a66', verde: '#8be38f', txt: '#eaf7f4', suave: '#9dbdb9', linea: '#2c5a5e' };
  // ZONA SEGURA: todo el contenido va entre x 160–1760 e y 230–980 (los subtítulos usan la franja de arriba)
  function el(tag, at, p) { var e = document.createElementNS(NS, tag); for (var k in at) e.setAttribute(k, at[k]); if (p) p.appendChild(e); return e; }
  function txt(p, x, y, s, size, fill, extra) { var t = el('text', Object.assign({ x: x, y: y, 'text-anchor': 'middle', 'dominant-baseline': 'central', 'font-size': size, fill: fill || C.txt }, extra || {}), p); t.textContent = s; return t; }
  function caja(p, x, y, w, h, fill, stroke, r, sw) { return el('rect', { x: x - w / 2, y: y - h / 2, width: w, height: h, rx: r == null ? 24 : r, fill: fill || 'url(#gCard)', stroke: stroke || C.linea, 'stroke-width': sw || 4 }, p); }
  function pieza(p, x, y) { var w = el('g', { transform: 'translate(' + x + ' ' + y + ')' }, p); return el('g', { 'data-c': 1, opacity: 0 }, w); }
  function usar(p, id, s) { return el('use', { href: '#' + id, transform: s ? 'scale(' + s + ')' : '' }, p); }
  function chip(p, x, y, w, h, s, o) { o = o || {}; var g = pieza(p, x, y); caja(g, 0, 0, w, h, o.fill || 'url(#gCard)', o.stroke || C.linea, o.r == null ? h / 2 : o.r, o.sw || 4).setAttribute('filter', 'url(#sombra)'); g.t = txt(g, 0, 2, s, o.size || 44, o.color || C.txt, o.ls ? { 'letter-spacing': o.ls } : null); return g; }
  function etiqueta(p, x, y, s) { return chip(p, x, y, Math.max(260, s.length * 26 + 80), 70, s, { fill: 'url(#gSol)', stroke: '#ffe7a8', color: '#3a2a00', size: 34, ls: 3 }); }
  function titulo(p, s) { return chip(p, 960, 280, Math.max(420, s.length * 30 + 110), 84, s, { fill: 'url(#gAqua)', stroke: '#d8fff7', color: '#06282a', size: 38, ls: 4 }); }
  // ---- entradas y salidas (suaves, profesionales) ----
  function IN(tl, g, pos, f) { f = f || {}; if (pos === 0) pos = '>'; var fr = Object.assign({ opacity: 0, y: 40, scale: .92 }, f); delete fr.d; delete fr.ease; return tl.fromTo(g, fr, { opacity: 1, y: 0, x: 0, scale: 1, rotation: 0, duration: f.d || .6, ease: f.ease || 'back.out(1.5)' }, pos); }
  function OUT(tl, g, pos, f) { if (pos === 0) pos = '>'; return tl.to(g, Object.assign({ opacity: 0, scale: .9, duration: .35, ease: 'power2.in' }, f || {}), pos); }
  function pop(tl, g, pos) { if (pos === 0) pos = '>'; return tl.to(g, { scale: 1.12, duration: .18, yoyo: true, repeat: 1, ease: 'power2.out' }, pos); }
  function fila(p, cx, y, cab, dig, w, vy) { // estante de lugares
    w = w || 190; var gap = 26, n = cab.length, x0 = cx - ((n - 1) * (w + gap)) / 2, R = { slots: [], digs: [], vals: [], cabs: [], xs: [] };
    cab.forEach(function (c, k) {
      var x = x0 + k * (w + gap); R.xs.push(x);
      var hc = pieza(p, x, y - 150); txt(hc, 0, 0, c, w < 180 ? 19 : 24, C.aqua, { 'letter-spacing': 2 }); R.cabs.push(hc);
      var s = pieza(p, x, y); var r = caja(s, 0, 0, w, 220, 'url(#gCard)', C.linea, 28, 6); s.r = r; R.slots.push(s);
      var d = pieza(p, x, y); txt(d, 0, 6, dig[k], 170, C.txt); R.digs.push(d);
      var v = pieza(p, x, y + (vy || 160)); v.t = txt(v, 0, 0, '', 50, C.sol); R.vals.push(v);
    });

  }
  function contador(tl, t, desde, hasta, pos, dur) { var o = { v: desde }; return tl.to(o, { v: hasta, duration: dur || 1, ease: 'power2.inOut', onUpdate: function () { t.textContent = Math.round(o.v).toLocaleString('es-AR'); } }, pos); }

  // ================= LA LECCIÓN =================
  // voz: lo que se dice (entre *asteriscos* las palabras clave). armar(g, tl, B): B(k) marca dónde arranca la animación de la frase k.
  var E = [];

  E.push({ voz: ['¿Cómo puede ser que un *2* valga *200*?', 'Es el mismo 2… pero ubicado en otro *lugar*.', 'Hoy vas a descubrir el secreto de nuestros números: el *sistema decimal*.'],
    armar: function (g, tl, B) {
      var dos = pieza(g, 960, 600); var t = txt(dos, 0, 0, '2', 420, C.txt, { filter: 'url(#brillo)' });
      B(0); IN(tl, dos, 0, { scale: 0, rotation: -20, y: 0, d: 1, ease: 'elastic.out(1,.55)' });
      B(1); tl.to(dos, { x: -10, duration: .05, repeat: 5, yoyo: true }); contador(tl, t, 2, 200, '>', 1.2); tl.to(t, { attr: { fill: C.sol }, duration: .4 }, '<.6').to(dos, { scale: .8, duration: .4 }, '<');
      var tt = pieza(g, 960, 600); caja(tt, 0, 0, 1100, 260, 'url(#gCard)', C.aqua, 40, 6).setAttribute('filter', 'url(#sombra)');
      txt(tt, 0, -45, 'EL SISTEMA DECIMAL', 74, C.txt); txt(tt, 0, 50, 'y el valor posicional', 44, C.aqua);
      B(2); OUT(tl, dos, 0, { scale: 1.6 }); IN(tl, tt, '<.2', { scale: .6, y: 0 });
    } });

  E.push({ voz: ['Los romanos escribían el año 2026 así: *MMXXVI*.', 'Nosotros lo escribimos *2.026*.', 'Es el *mismo número*. Lo que cambia es el sistema.', 'Un *sistema de numeración* es el conjunto de símbolos y reglas que usamos para escribir y nombrar los números.'],
    armar: function (g, tl, B) {
      var pi = pieza(g, 560, 520); caja(pi, 0, 0, 560, 300, 'url(#gPiedra)', '#d8d0c0', 30, 6).setAttribute('filter', 'url(#sombra)');
      var letras = 'MMXXVI'.split('').map(function (l, k) { return txt(pi, -175 + k * 70, 10, l, 96, '#3d382f', { 'font-family': 'Georgia,serif', opacity: 0 }); });
      txt(pi, 0, -115, 'SISTEMA ROMANO', 26, '#4a4438', { 'letter-spacing': 4 });
      var di = pieza(g, 1360, 520); caja(di, 0, 0, 560, 300, 'url(#gCard)', C.aqua, 30, 6).setAttribute('filter', 'url(#sombra)');
      txt(di, 0, 10, '2.026', 120, C.txt); txt(di, 0, -115, 'SISTEMA DECIMAL', 26, C.aqua, { 'letter-spacing': 4 });
      var ig = pieza(g, 960, 520); txt(ig, 0, 0, '=', 140, C.sol, { filter: 'url(#brillo)' });
      var de = pieza(g, 960, 840); caja(de, 0, 0, 1400, 170, 'url(#gCard)', C.sol, 30, 5).setAttribute('filter', 'url(#sombra)');
      txt(de, 0, -38, 'SISTEMA DE NUMERACIÓN', 34, C.sol, { 'letter-spacing': 4 }); txt(de, 0, 30, 'Símbolos y reglas para escribir y nombrar los números', 40, C.txt);
      B(0); IN(tl, pi, 0, { x: -200, y: 0 }); tl.to(letras, { opacity: 1, duration: .25, stagger: .15 });
      B(1); IN(tl, di, 0, { x: 200, y: 0 });
      B(2); IN(tl, ig, 0, { scale: 0, y: 0 }); pop(tl, pi, '>'); pop(tl, di, '<');
      B(3); tl.to([pi, di, ig], { y: -60, scale: .85, duration: .5, ease: 'power2.inOut' }); IN(tl, de, '<.1');
    } });

  E.push({ voz: ['Nuestro sistema usa solo *10 cifras*: del 0 al 9.', 'Con esas diez escribimos *cualquier número*, por más grande que sea.', '¿El truco? *Agrupar de a 10*.'],
    armar: function (g, tl, B) {
      var cif = []; for (var k = 0; k < 10; k++) { var c = chip(g, 960 + (k - 4.5) * 140, 520, 116, 150, String(k), { r: 26, size: 86, stroke: C.aqua }); cif.push(c); }
      var gr = pieza(g, 960, 800); var gt = txt(gr, 0, 0, '7.093.582.461', 110, C.sol, { filter: 'url(#brillo)' });
      var anillo = pieza(g, 960, 520); el('rect', { x: -720, y: -110, width: 1440, height: 220, rx: 110, fill: 'none', stroke: C.sol, 'stroke-width': 8, 'stroke-dasharray': '24 18' }, anillo);
      var x10 = etiqueta(g, 960, 790, 'GRUPOS DE 10');
      B(0); cif.forEach(function (c, k) { IN(tl, c, k ? '<.09' : 0, { y: -300, ease: 'bounce.out', d: .7 }); });
      B(1); IN(tl, gr, 0, { scale: .4, y: 0 }); tl.to(cif, { y: -20, duration: .25, stagger: { each: .05, yoyo: true, repeat: 1 } }, '<');
      B(2); OUT(tl, gr, 0); IN(tl, anillo, '<.2', { scale: 1.2, y: 0 }); tl.to(anillo, { rotation: 0, duration: .1 }); IN(tl, x10, '<.3');
    } });

  E.push({ voz: ['Imaginá una fábrica de *alfajores*. Cada alfajor suelto es una *unidad*.', 'Cuando juntás 10 alfajores se arma un paquete: una *decena*.', 'Con 10 paquetes se llena una caja: una *centena*.', 'Y 10 cajas llenan un camión: una *unidad de mil*.', 'Cada orden vale *10 veces* el anterior.'],
    armar: function (g, tl, B) {
      var X = [370, 770, 1170, 1570], Y = 560, nom = [['UNIDAD', '1'], ['DECENA', '10'], ['CENTENA', '100'], ['UNIDAD DE MIL', '1.000']];
      var lab = X.map(function (x, k) { var p = pieza(g, x, 820); caja(p, 0, 0, 340, 120, 'url(#gCard)', C.linea, 24, 4); txt(p, 0, -22, nom[k][0], 28, C.aqua, { 'letter-spacing': 3 }); txt(p, 0, 28, nom[k][1], 48, C.txt); return p; });
      var u = pieza(g, X[0], Y); usar(u, 'alf', 1.9);
      var mini = []; for (var k = 0; k < 10; k++) { var m = pieza(g, X[1] + (k % 5 - 2) * 56, Y - 30 + Math.floor(k / 5) * 60); usar(m, 'alf', .55); mini.push(m); }
      var pk = pieza(g, X[1], Y); usar(pk, 'pack', 2);
      var mp = []; for (k = 0; k < 10; k++) { var q = pieza(g, X[2] + (k % 2 - .5) * 132, Y - 128 + Math.floor(k / 2) * 64); usar(q, 'pack', .85); mp.push(q); }
      var bx = pieza(g, X[2], Y); usar(bx, 'caja', 1.8);
      var mc = []; for (k = 0; k < 10; k++) { var b = pieza(g, X[3] + (k % 5 - 2) * 62, Y - 40 + Math.floor(k / 5) * 64); usar(b, 'caja', .36); mc.push(b); }
      var cm = pieza(g, X[3], Y); usar(cm, 'camion', 1.1);
      var fl = [0, 1, 2].map(function (k) { var f = pieza(g, (X[k] + X[k + 1]) / 2, Y); el('circle', { r: 46, fill: C.sol }, f); txt(f, 0, 2, '×10', 34, '#3a2a00'); return f; });
      B(0); IN(tl, u, 0, { scale: 0, y: 0, ease: 'back.out(2.2)' }); IN(tl, lab[0], '<.3');
      B(1); mini.forEach(function (m, k) { IN(tl, m, k ? '<.07' : 0, { x: -400, y: -100, scale: .3, ease: 'power3.out', d: .55 }); }); IN(tl, pk, '>.1', { scaleY: 0, y: 0 }); tl.to(mini, { opacity: 0, duration: .2 }, '<.2'); IN(tl, lab[1], '<.2');
      B(2); mp.forEach(function (m, k) { IN(tl, m, k ? '<.07' : 0, { x: -400, y: -100, scale: .3, ease: 'power3.out', d: .55 }); }); IN(tl, bx, '>.1', { y: -500, ease: 'bounce.out', d: .8 }); tl.to(mp, { opacity: 0, duration: .2 }, '<.3'); IN(tl, lab[2], '<.2');
      B(3); mc.forEach(function (m, k) { IN(tl, m, k ? '<.07' : 0, { x: -400, y: -100, scale: .3, ease: 'power3.out', d: .55 }); }); IN(tl, cm, '>.1', { x: 500, y: 0, ease: 'power3.out', d: .8 }); tl.to(mc, { opacity: 0, duration: .2 }, '<.4'); IN(tl, lab[3], '<.2');
      B(4); fl.forEach(function (f, k) { IN(tl, f, k ? '<.25' : 0, { scale: 0, y: 0, ease: 'back.out(3)' }); });
    } });

  E.push({ voz: ['Ahora mirá el número *4.205*.', 'Cada cifra ocupa un *lugar*: unidades de mil, centenas, decenas y unidades.', 'Y cada lugar vale *10 veces* más que el de su derecha.', 'Por eso el 4 vale *4.000*, el 2 vale *200*, el 0 vale *0* y el 5 vale *5*.', 'El valor de una cifra depende del lugar que ocupa. Eso es el *valor posicional*.'],

      var F = fila(g, 960, 580, ['UNIDAD DE MIL', 'CENTENA', 'DECENA', 'UNIDAD'], ['4', '2', '0', '5']);

      B(0); IN(tl, n, 0, { scale: .5, y: 0 });
      B(1); F.slots.forEach(function (s, k) { IN(tl, s, k ? '<.08' : 0); IN(tl, F.cabs[k], '<'); }); F.digs.forEach(function (d, k) { IN(tl, d, k ? '<.25' : '>-.1', { y: -500, ease: 'bounce.out', d: .7 }); });
      B(2); [2, 1, 0].forEach(function (k, j) { IN(tl, fl[k], j ? '<.35' : 0, { scale: 0, y: 0, ease: 'back.out(3)' }); });
      B(3); OUT(tl, fl, 0); F.vals.forEach(function (v, k) { IN(tl, v, k ? '<.9' : '<.2', { y: -60 }); tl.to(F.slots[k].r, { attr: { stroke: C.sol }, duration: .2, yoyo: true, repeat: 1 }, '<'); });
      B(4); tl.to(F.slots[1].r, { attr: { stroke: C.sol, 'stroke-width': 10 }, duration: .3 }); pop(tl, F.digs[1], '<'); IN(tl, vp, '<.2');
    } });

  E.push({ voz: ['Ojo con esto: la *cifra* es el símbolo que escribís. El 2.', 'El *valor* es lo que ese símbolo representa en su lugar: 200.', '¿Y el cero? Parece que no hace nada… pero mirá qué pasa si lo *sacamos*.', '¡Se convierte en *425*! Es otro número.', 'El cero *marca un lugar vacío*, y mantiene a cada cifra en su lugar.'],
    armar: function (g, tl, B) {
      function tarj(x, cab, val, col) { var p = pieza(g, x, 580); caja(p, 0, 0, 560, 440, 'url(#gCard)', col, 40, 6).setAttribute('filter', 'url(#sombra)'); txt(p, 0, -150, cab, 40, col, { 'letter-spacing': 6 }); txt(p, 0, 30, val, 190, C.txt); return p; }
      var c1 = tarj(620, 'CIFRA', '2', C.aqua), c2 = tarj(1300, 'VALOR', '200', C.sol);
      var F = fila(g, 960, 560, ['UNIDAD DE MIL', 'CENTENA', 'DECENA', 'UNIDAD'], ['4', '2', '0', '5']);
      var r = pieza(g, 960, 580); var rt = txt(r, 0, 0, '425', 260, C.coral, { filter: 'url(#brillo)' });
      var se = pieza(g, 960, 850); caja(se, 0, 0, 620, 120, 'none', C.coral, 20, 10); txt(se, 0, 4, '¡OTRO NÚMERO!', 64, C.coral, { 'letter-spacing': 4 });
      var lv = etiqueta(g, F.xs[2], 880, 'LUGAR VACÍO');
      B(0); IN(tl, c1, 0, { x: -200, y: 0 });
