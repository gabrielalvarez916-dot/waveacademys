name: Misiones del NIVEL MEDIO (carga completa)
# MÁQUINA DEL NIVEL MEDIO (separada de todo lo del Avanzado, que no se toca).
# Al subir a main un contenido/medio/**/mision-N.json nuevo o cambiado, hace TODO solo:
#   1) carga actividades, Relámpago y examen (cargar_mision_medio; si ya estaba, no pisa nada) y la lección interactiva (cargar_leccion_medio)
#   2) arma los PDF (argentino y neutro) y los sube a cada lección (pdf-medio)
# Las clases animadas van por voz-clases-medio.yml. Nada se publica: queda para revisar en Contenidos.
on:
  push:
    branches: [main]
    paths: ['contenido/medio/**/mision-*.json', 'contenido/medio/recargar.txt']
  workflow_dispatch:
    inputs:
      mision: { description: 'Archivo de la misión (ej. contenido/medio/matematica-1/mision-1/mision-1.json)', required: true }
permissions: { contents: read, actions: read }
concurrency: { group: mision-medio, cancel-in-progress: false }
jobs:
  mision:
    runs-on: ubuntu-latest
    env: { MEDIO_TOKEN: '${{ secrets.MEDIO_TOKEN }}' }  # secreto de GitHub (una sola vez); sin él, la carga la hace Claude desde Supabase
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fuentes y librerías
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core
          pip install reportlab pillow
      - name: Qué misiones hay que cargar
        id: cuales
        env: { MANUAL: '${{ github.event.inputs.mision }}', ANTES: '${{ github.event.before }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          # Desde cuándo mirar: el último cambio que esta máquina terminó BIEN (no el cambio anterior). Así, si una corrida en espera se cancela
          # porque llegó otra más nueva, lo que traía se carga igual en la siguiente (da igual quién lo subió ni cuántos cambios haya juntos).
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mision-medio.yml/runs?status=success&event=push&branch=main&per_page=1" --jq '.workflow_runs[0].head_sha' 2>/dev/null || true)
          if [ -z "$BASE" ] || [ "$BASE" = "null" ] || ! git merge-base --is-ancestor "$BASE" "$GITHUB_SHA" 2>/dev/null; then BASE="$ANTES"; fi
          echo "Mirando cambios desde: $BASE"
          if [ -n "$MANUAL" ]; then L="$MANUAL"
          else L=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- 'contenido/medio/**/mision-*.json' 2>/dev/null || git diff --name-only HEAD~1 HEAD -- 'contenido/medio/**/mision-*.json'); fi
          # recargar.txt: una misión por línea (para volver a cargar algo sin cambiarlo)
          if git diff --name-only "$BASE" "$GITHUB_SHA" 2>/dev/null | grep -qx 'contenido/medio/recargar.txt'; then L="$L $(grep -v '^#' contenido/medio/recargar.txt)"; fi
          L=$(for f in $L; do [ -f "$f" ] && echo "$f"; done | sort -u | tr '\n' ' ')
          echo "Misiones: $L"; echo "lista=$L" >> "$GITHUB_OUTPUT"
      - name: Candado de las reglas de calidad (si alguien cambió los controles, no se carga nada)
        env:
          REGLAS_SHA: ${{ vars.REGLAS_SHA }}
        run: |
          H=$(cat tools/interactiva/validar.js tools/control_calidad.py | sha256sum | cut -c1-64)
          if [ "$H" != "$REGLAS_SHA" ]; then echo "::error::Las reglas de calidad (validar.js / control_calidad.py) cambiaron. Solo Gabriel puede aprobarlo, actualizando la variable REGLAS_SHA en GitHub (Settings > Secrets and variables > Actions > Variables). Valor nuevo: $H"; exit 1; fi
      - name: Control de la lección interactiva (reglas por ciclo; si no cumple, no se carga nada)
        if: steps.cuales.outputs.lista != ''
        run: node tools/interactiva/validar.js ${{ steps.cuales.outputs.lista }}
      - name: Control de calidad (si no cumple, no se carga nada)
        if: steps.cuales.outputs.lista != ''
        run: python tools/control_calidad.py ${{ steps.cuales.outputs.lista }}
      - name: Cargar actividades y examen
        if: steps.cuales.outputs.lista != '' && env.MEDIO_TOKEN != ''
        run: python tools/medio/cargar_mision.py ${{ steps.cuales.outputs.lista }}
      - name: Cargar la lección interactiva (la escrita en sesión)
        if: steps.cuales.outputs.lista != '' && env.MEDIO_TOKEN != ''
        run: python tools/medio/cargar_leccion.py ${{ steps.cuales.outputs.lista }}
      - name: Armar y subir los PDF
        if: steps.cuales.outputs.lista != '' && env.MEDIO_TOKEN != ''
        run: python tools/medio/pdf/generar.py ${{ steps.cuales.outputs.lista }}
      - name: Cargar las clases que ya tienen voz (incluye las de la misión par de una ALTERNATIVA)
        if: steps.cuales.outputs.lista != '' && env.MEDIO_TOKEN != ''
        run: python tools/medio/clase/cargar.py $(ls tools/medio/clase/dist 2>/dev/null | sed 's/\.html$//')
      - name: Publicar misiones completas (solo Nivel Medio)
        if: env.MEDIO_TOKEN != ''
        run: python tools/medio/publicar.py
