name: Voz de las clases del NIVEL MEDIO
# MÁQUINA DEL NIVEL MEDIO (separada de voz-clases.yml, que es del Avanzado y no se toca).
# Solo mira tools/medio/**: graba la voz, arma el HTML y carga cada clase con cargar_clase_medio (solo acepta lecciones del Nivel Medio).
on:
  push:
    branches: [main]
    paths: ['tools/medio/clase/lecciones/*.json', 'tools/medio/clase/motor/**', 'tools/medio/clase/*.py', 'tools/medio/neutro_medio.py', 'tools/medio/primeros_anios.py', '.github/workflows/voz-clases-medio.yml', 'contenido/medio/recargar.txt']
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency: { group: voz-clases-medio, cancel-in-progress: false }
jobs:
  voz:
    runs-on: ubuntu-latest
    env: { MEDIO_TOKEN: '${{ secrets.MEDIO_TOKEN }}' }  # secreto de GitHub (una sola vez); sin él, la carga la hace Claude desde Supabase
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts
      - run: sudo apt-get install -y -qq ffmpeg   # para nivelar el audio de ElevenLabs
      - name: Generar voz
        # PAUSADO (tope 0) a pedido de Gaby mientras se terminan Sociales; para reactivar: ELEVEN_TOPE '8000'. Lengua 1.º y 2.º año (nivel medio) sale con ElevenLabs (arg y neutro); el resto sigue con la voz de siempre. Tope de caracteres por corrida.
        env: { VOZ_MINUTOS: '80', ELEVEN_KEY: '${{ secrets.ELEVEN_KEY }}', ELEVEN_TOPE: '0', ELEVEN_VERSIONES: 'arg,neutro', ELEVEN_VOZ_NEUTRO: '${{ vars.ELEVEN_VOZ_NEUTRO }}' }
        run: python tools/medio/clase/voz_edge.py
      - run: python tools/medio/clase/armar.py --cambiadas   # solo las clases con lección o voz nueva
      - name: Anotar qué clases cambiaron (se cargan solo esas, no todas)
        run: git status --porcelain tools/medio/clase/dist | awk '{print $NF}' | grep '\.html$' | xargs -r -n1 basename | sed 's/\.html$//' > /tmp/cambiadas.txt; wc -l < /tmp/cambiadas.txt
      - name: 'Guardar voz y HTML en el repo (antes de cargar, para que no se pierdan)'
        run: |
          git config user.name "wave-bot"; git config user.email "wave-bot@users.noreply.github.com"
          git add tools/medio/clase/voz tools/medio/clase/dist
          git diff --cached --quiet || git commit -m "Voz de clases del Nivel Medio (automático)"
          for i in 1 2 3; do git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && break; sleep 5; done
      - name: Cargar en la plataforma (solo Nivel Medio)
        if: env.MEDIO_TOKEN != ''
        run: 'L=$(cat /tmp/cambiadas.txt); if [ -n "$L" ]; then python tools/medio/clase/cargar.py $L; else echo "nada nuevo para cargar"; fi'
      - name: Publicar misiones completas (solo Nivel Medio)
        if: ${{ !cancelled() && env.MEDIO_TOKEN != '' }}   # publica lo que esté completo aunque una carga haya fallado
        run: python tools/medio/publicar.py
      - name: Seguir si quedaron voces sin grabar
        if: hashFiles('tools/medio/clase/voz/.pendiente') != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run voz-clases-medio.yml --ref main
