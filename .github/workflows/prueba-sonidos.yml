name: Prueba de sonidos (temporal)
on:
  push:
    branches: [prueba-sonidos]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts numpy faster-whisper
      - run: python tools/medio/prueba_sonidos/probar.py
