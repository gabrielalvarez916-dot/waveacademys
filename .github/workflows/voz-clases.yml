name: Voz de las clases animadas
# Genera el audio (voces neuronales de Microsoft, gratis) de cada clase y arma el HTML final.
on:
  push:
    branches: [main]
    paths: ['tools/neutro.py', 'tools/clase/lecciones/*.json', 'tools/clase/cargar.py', 'tools/clase/motor/**', 'tools/clase/voz_edge.py', 'tools/clase/armar.py', '.github/workflows/voz-clases.yml']
  workflow_dispatch:
    inputs:
      voz: { description: 'Voz (ej. es-MX-JorgeNeural, es-AR-TomasNeural)', default: 'es-MX-JorgeNeural' }
      rate: { description: 'Velocidad (ej. +8%, +15%)', default: '+25%' }
      cargar: { description: 'Volver a cargar estas clases ya armadas (slugs separados por espacio)', default: '' }
permissions:
  contents: write
  actions: write
concurrency: { group: voz-clases, cancel-in-progress: false }
jobs:
  voz:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install edge-tts
      - name: Generar voz
        env:
          VOZ: ${{ github.event.inputs.voz || 'es-MX-JorgeNeural' }}
          RATE: ${{ github.event.inputs.rate || '+25%' }}
          VOZ_MINUTOS: '80'
        run: python tools/clase/voz_edge.py
      - run: python tools/clase/armar.py --cambiadas   # solo las clases con lección o voz nueva (un cambio de motor no re-sube todo)
      - name: Cargar en la plataforma
        env: { CARGAR: '${{ github.event.inputs.cargar }}' }
        run: python tools/clase/cargar.py $CARGAR
      - name: Guardar
        run: |
          git config user.name "wave-bot"; git config user.email "wave-bot@users.noreply.github.com"
          git add tools/clase/voz tools/clase/dist actividades/clases
          git diff --cached --quiet || git commit -m "Voz de clases animadas (automático)"
          for i in 1 2 3; do git fetch origin main && git rebase -X theirs origin/main && git push origin HEAD:main && break; sleep 5; done
      - name: Publicar misiones completas (solo Nivel Avanzado)
        env: { WAVE_GEN_TOKEN: '${{ secrets.WAVE_GEN_TOKEN }}' }
        run: python tools/publicar_avanzado.py
      - name: Seguir si quedaron voces sin grabar (tope de tiempo por corrida)
        if: hashFiles('tools/clase/voz/.pendiente') != ''
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh workflow run voz-clases.yml --ref main
