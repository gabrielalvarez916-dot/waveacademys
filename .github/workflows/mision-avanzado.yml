name: Misiones del NIVEL AVANZADO (carga completa)
# Al subir a main un contenido/<materia>/mision-N/mision-N.json nuevo, hace TODO solo:
#   1) carga borradores, actividades, Relámpago y examen (cargar_mision_avanzado; si ya estaba, no pisa nada)
#      y la práctica de cada tema de la lección interactiva (tools/interactiva; esto sí se actualiza aunque la misión ya estuviera)
#   2) arma los PDF (argentino y neutro) y los sube a cada lección
#   3) publica las misiones que quedaron completas
# Las clases animadas van por voz-clases.yml (al subir tools/clase/lecciones/*.json). Nada se publica hasta que la misión está completa.
on:
  push:
    branches: [main]
    paths: ['contenido/*/mision-*/mision-*.json']
  workflow_dispatch:
    inputs:
      mision: { description: 'Archivo de la misión (ej. contenido/lengua-1/mision-5/mision-5.json). Con "lecciones-mate" arma la lección interactiva de TODAS las misiones de Matemática', required: true }
permissions: { contents: read, actions: read }
concurrency: { group: mision-avanzado, cancel-in-progress: false }
jobs:
  mision:
    runs-on: ubuntu-latest
    env: { WAVE_GEN_TOKEN: '${{ secrets.WAVE_GEN_TOKEN }}' }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fuentes y librerías
        run: |
          sudo apt-get update -y && sudo apt-get install -y fonts-dejavu-core
          pip install reportlab pillow
      - name: Qué misiones hay que cargar
        id: cuales
        env: { MANUAL: '${{ github.event.inputs.mision }}', ANTES: '${{ github.event.before }}', GH_TOKEN: '${{ github.token }}' }
        run: |
          # Desde cuándo mirar: el último cambio que esta máquina terminó BIEN (no solo el cambio anterior). Así, si una corrida en espera se cancela
          # porque llegó otra más nueva, lo que traía se carga igual en la siguiente. Si ese cambio tiene más de 12 horas, se usa el anterior.
          BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/mision-avanzado.yml/runs?status=success&event=push&branch=main&per_page=1" --jq '.workflow_runs[0] | select(.created_at > (now - 43200 | todate)) | .head_sha' 2>/dev/null || true)
          if [ -z "$BASE" ] || [ "$BASE" = "null" ] || ! git merge-base --is-ancestor "$BASE" "$GITHUB_SHA" 2>/dev/null; then BASE="$ANTES"; fi
          echo "Mirando cambios desde: $BASE"
          if [ "$MANUAL" = "lecciones-mate" ]; then L=$(ls contenido/matematica-*/mision-*/mision-*.json | tr '\n' ' '); echo "lista=$L" >> "$GITHUB_OUTPUT"; echo "solo_leccion=1" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ -n "$MANUAL" ]; then L="$MANUAL"
          else L=$(git diff --name-only "$BASE" "$GITHUB_SHA" -- 'contenido/*/mision-*/mision-*.json' 2>/dev/null || git diff --name-only HEAD~1 HEAD -- 'contenido/*/mision-*/mision-*.json'); fi
          L=$(echo "$L" | tr ' ' '\n' | grep -v '^contenido/medio/' | tr '\n' ' ')  # primaria va por mision-medio.yml
          L=$(for f in $L; do [ -f "$f" ] && echo "$f"; done | sort -u | tr '\n' ' ')
          echo "Misiones: $L"; echo "lista=$L" >> "$GITHUB_OUTPUT"
          # las que solo cambiaron en la práctica de la lección interactiva no se vuelven a revisar ni a cargar enteras
          if [ -n "$MANUAL" ]; then C="$L"; else C=$(python tools/interactiva/solo_practicas.py "$BASE" $L); fi
          echo "Carga completa: $C"; echo "completas=$C" >> "$GITHUB_OUTPUT"
      - name: Candado de las reglas de calidad (si alguien cambió los controles, no se carga nada)
        env:
          REGLAS_SHA: ${{ vars.REGLAS_SHA }}
        run: |
          H=$(cat tools/interactiva/validar.js tools/control_calidad.py | sha256sum | cut -c1-64)
          if [ "$H" != "$REGLAS_SHA" ]; then echo "::error::Las reglas de calidad (validar.js / control_calidad.py) cambiaron. Solo Gabriel puede aprobarlo, actualizando la variable REGLAS_SHA en GitHub (Settings > Secrets and variables > Actions > Variables). Valor nuevo: $H"; exit 1; fi
      - name: Control de calidad de la lección interactiva (si no cumple, no se carga nada)
        if: steps.cuales.outputs.lista != '' && steps.cuales.outputs.solo_leccion != '1'
        run: node tools/interactiva/validar.js ${{ steps.cuales.outputs.lista }}
      - name: Control de calidad (si no cumple, no se carga nada)
        if: steps.cuales.outputs.completas != '' && steps.cuales.outputs.solo_leccion != '1'
        run: python tools/control_calidad.py ${{ steps.cuales.outputs.completas }}
      - name: Cargar borradores, actividades y examen
        if: steps.cuales.outputs.completas != '' && steps.cuales.outputs.solo_leccion != '1'
        run: python tools/cargar_mision_avanzado.py ${{ steps.cuales.outputs.completas }}
      - name: Cargar la práctica de cada tema (lección interactiva)
        if: steps.cuales.outputs.lista != '' && steps.cuales.outputs.solo_leccion != '1'
        run: python tools/interactiva/cargar.py ${{ steps.cuales.outputs.lista }}
      - name: Cargar la lección interactiva escrita en sesión (la máquina no inventa lecciones)
        if: steps.cuales.outputs.lista != ''
        run: python tools/interactiva/cargar_leccion.py ${{ steps.cuales.outputs.lista }}
      - name: Armar y subir los PDF
        if: steps.cuales.outputs.lista != '' && steps.cuales.outputs.solo_leccion != '1'
        run: python tools/pdf/generar.py
      - name: Publicar misiones completas (solo Nivel Avanzado)
        if: always()
        run: python tools/publicar_avanzado.py
