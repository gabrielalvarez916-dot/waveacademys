name: Buscar videos v2

on:
  schedule:
    - cron: "20 */3 * * *"   # para lecciones nuevas que vaya generando la fábrica
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: busca pocas lecciones y NO guarda nada"
        type: boolean
        default: false

concurrency:
  group: buscar-videos-v2
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -U yt-dlp requests
      - name: Buscar videos
        env:
          SUPABASE_URL: https://ndglmonqpqpfgeoxatcb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOTE: ${{ inputs.prueba && '40' || '6500' }}
          DRY_RUN: ${{ inputs.prueba && '1' || '0' }}
          HILOS: "6"
          MAX_MIN: "45"
        run: python buscar_videos_v2.py
      - name: Guardar resultado de la prueba
        if: ${{ inputs.prueba }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prueba_videos.md
          git commit -m "Prueba de búsqueda de videos (resultado, no guarda nada en la base)" || true
          git push
