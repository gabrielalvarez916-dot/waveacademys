name: Buscar videos v2

on:
  workflow_dispatch:
    inputs:
      prueba:
        description: "Prueba: busca pocas lecciones y NO guarda nada"
        type: boolean
        default: false

concurrency:
  group: buscar-videos-v2
  cancel-in-progress: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: pip install -U yt-dlp requests
      - name: Buscar videos
        env:
          SUPABASE_URL: https://ndglmonqpqpfgeoxatcb.supabase.co
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          LOTE: ${{ inputs.prueba && '40' || '1200' }}
          DRY_RUN: ${{ inputs.prueba && '1' || '0' }}
          HILOS: "6"
          MAX_MIN: "40"
        run: python buscar_videos_v2.py
