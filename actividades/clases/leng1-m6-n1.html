<script>window.CLASE={"slug":"leng1-m6-n1","step_id":"037ca438-4ffc-4546-bac5-2d85e92fa42b","materia":"Lengua y Literatura I","titulo":"Cómo funciona el humor","sub":"Lengua y Literatura I · Misión 6 · Nivel 1","escenas":[{"t":"chat","contacto":{"nombre":"Lucas","emoji":"🧑"},"mensajes":[{"yo":false,"txt":"Anoté todo en un papel para no olvidarme de nada"},{"yo":true,"txt":"¡Bien organizado!"},{"yo":false,"txt":"Ahora no me acuerdo dónde dejé el papel 🤦"}],"titulo":"EL HUMOR","sub":"por qué nos reímos","voz":["Lucas cuenta que anotó todo en un papel para no olvidarse de nada.","Vos lo felicitás por organizado.","Y él responde que no se acuerda dónde dejó el papel.","Te reíste, ¿no? Hoy vemos *por qué*: el humor tiene mecanismos que se pueden reconocer."]},{"t":"definicion","palabra":"Incongruencia","texto":"Choque entre lo que esperábamos y lo que finalmente pasa. Es el motor de casi todo el humor.","emoji":"💥","voz":["El papel tenía que resolver el problema y terminó empeorándolo. Ese choque se llama *incongruencia*.","Es el motor de casi todo el humor: el texto arma una expectativa y después la rompe."]},{"t":"antesdespues","antes":{"cab":"Lo que esperamos","emoji":"🦸","texto":"El héroe entra al castillo, desenvaina la espada y…"},"despues":{"cab":"Lo que pasa","emoji":"🤧","texto":"…estornuda por el polvo y se le cae la espada."},"voz":["Mirá cómo se arma. El héroe entra al castillo, desenvaina la espada, y esperamos una gran batalla.","Pero estornuda por el polvo y se le cae la espada. La expectativa se rompe, y aparece la risa."]},{"t":"bloques","titulo":"TRES RECURSOS DEL HUMOR","items":[{"cab":"Lo inesperado","txt":"un final que rompe lo previsto"},{"cab":"La exageración","txt":"agrandar algo hasta lo absurdo"},{"cab":"Doble sentido","txt":"el juego de palabras"}],"voz":["Los textos humorísticos usan tres recursos principales.","*Lo inesperado*: un final que rompe lo previsto.","La *exageración*: agrandar algo hasta volverlo absurdo.","Y el *juego de palabras*: aprovechar que una palabra tiene dos sentidos."]},{"t":"escala","titulo":"LA EXAGERACIÓN","items":[{"txt":"Tengo hambre","emoji":"🍽️","valor":1},{"txt":"Me comería una vaca","emoji":"🐄","valor":3},{"txt":"Me comería la cordillera con mostaza","emoji":"🏔️","valor":6}],"voz":["Mirá cómo crece una exageración. «Tengo hambre» es un dato.","«Me comería una vaca» ya exagera.","Y «me comería la cordillera con mostaza» lleva la exageración al absurdo, y por eso da risa."]},{"t":"quiz4","pregunta":"«—¿Tu perro muerde? —No. —(El perro lo muerde.) —¡Este no es mi perro!» ¿Qué recurso usa?","opciones":["Exageración","Lo inesperado","Juego de palabras","Ninguno"],"correcta":1,"voz":["Un clásico: alguien pregunta si el perro muerde, le dicen que no, el perro lo muerde, y el otro responde: «¡este no es mi perro!».","Pensá qué recurso hace reír.","*Lo inesperado*: el final cambia todo lo que creíamos."]},{"t":"errores","items":[{"mal":"El humor es solo para chistes","bien":"También aparece en cuentos, novelas y obras de teatro"},{"mal":"Si no me río, no hay humor","bien":"El recurso está aunque a vos no te cause gracia"}],"voz":["Dos ideas equivocadas.","El humor no es solo cosa de chistes: hay cuentos, novelas y obras enteras construidas con humor.","Y que a vos algo no te haga reír no significa que no haya humor: el recurso está ahí y se puede analizar."]},{"t":"resumen","items":[["Incongruencia","lo que esperamos choca con lo que pasa"],["Lo inesperado","un final que sorprende"],["Exageración","agrandar hasta lo absurdo"],["Juego de palabras","el doble sentido"]],"fin":{"titulo":"¡A practicar!","sub":"Nivel 1"},"voz":["Repasemos.","El humor nace de un choque entre lo esperado y lo que pasa.","La incongruencia.","Lo inesperado.","La exageración.","Y el juego de palabras. ¡A practicar!"]}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAABVNTUpIrHBk0NlIMFpoWYeURSDBh5AmYXUrWhcO07mXDtNYtaFgMjEkwH+vpvmQWkwGRiTaYP/tNr+mvr+n+mk0//////zILGGFo6WKZo6WKZE6WKyjjjC0P/NGXTJjzT6FEZlgtOz9hybaQQhCgbI
