<script>window.CLASE={"slug":"leng1-m9-n4","step_id":"a8476b20-35d3-4d28-b1eb-aae7b765ba9b","materia":"Lengua y Literatura I","titulo":"De la epopeya al relato","sub":"Lengua y Literatura I · Misión 9 · Nivel 4","escenas":[{"t":"personaje","personaje":{"nombre":"El aedo","emoji":"🎶"},"lineas":[{"txt":"Canto la cólera de Aquiles…","animo":"feliz"},{"txt":"Y la repito cada noche, igual y distinta.","animo":"piensa"}],"voz":["En la antigua Grecia, las epopeyas las cantaban los *aedos*, poetas que recorrían pueblos y palacios. Empezaban invocando a la diosa de la poesía para cantar la cólera de Aquiles.","Cada noche repetían el relato de memoria, sin libro, y por eso la épica tiene tantas fórmulas y repeticiones."]},{"t":"definicion","palabra":"Transmisión oral","texto":"Forma de conservar un relato contándolo o cantándolo de memoria, de generación en generación.","emoji":"🗣️","voz":["Eso se llama *transmisión oral*: un relato que se conserva contándolo de memoria, de generación en generación.","Los epítetos, el verso y las frases repetidas ayudaban a recordar historias larguísimas."]},{"t":"linea","titulo":"EPOPEYAS DEL MUNDO","eventos":[{"fecha":"Hace +4.000 años","txt":"Gilgamesh, en Mesopotamia","emoji":"🏺"},{"fecha":"Siglo VIII a. C.","txt":"Ilíada y Odisea, en Grecia","emoji":"🏛️"},{"fecha":"Edad Media","txt":"Beowulf, en Inglaterra","emoji":"🐉"},{"fecha":"Hacia 1200","txt":"Cantar de mio Cid, en España","emoji":"🐎"}],"voz":["La épica es de todo el mundo. Hace más de cuatro mil años, en Mesopotamia, se contaba la historia de *Gilgamesh*, un rey que busca la inmortalidad.","En Grecia, hacia el siglo octavo antes de Cristo, la *Ilíada* y la *Odisea*.","En la Inglaterra medieval, *Beowulf*, el guerrero que enfrenta a un monstruo y a un dragón.","Y hacia el año 1200, en España, el *Cantar de mio Cid*, que cantaban los juglares."]},{"t":"comparar","a":{"cab":"Héroe épico","texto":"perfecto, representa a su pueblo, busca la gloria","emoji":"🛡️"},"b":{"cab":"Héroe de hoy","texto":"con dudas y miedos, busca su propio camino","emoji":"🎒"},"signo":"→","voz":["¿Y qué quedó de todo eso?","El héroe épico es casi perfecto: representa a su pueblo y busca la gloria.","El héroe de los relatos actuales tiene dudas, miedos y defectos, y muchas veces busca su propio camino más que la fama."]},{"t":"prediccion","pregunta":"Una saga actual: un chico deja su pueblo, enfrenta pruebas, recibe ayuda de un mentor y vuelve cambiado. ¿Tiene algo de épica?","a":{"txt":"Nada que ver","emoji":"🙅"},"b":{"txt":"Sí: el viaje del héroe","emoji":"🗺️"},"correcta":"b","resultado":"Repite la estructura de partida, pruebas, ayuda y regreso.","voz":["¿Qué creés? En una saga actual, un chico deja su pueblo, enfrenta pruebas, recibe ayuda de un mentor y vuelve cambiado. ¿Tiene algo de épica?","Pensá en Odiseo.","Sí: repite el *viaje del héroe*. Muchas películas, novelas y videojuegos de hoy usan esa estructura milenaria."]},{"t":"logro","titulo":"¡Misión cumplida!","items":["El héroe épico y sus epítetos","El viaje y las pruebas","Dioses, destino y fama","La épica en el tiempo"],"xp":100,"voz":["¡Terminaste las clases de la misión!","Ya conocés al héroe épico y sus epítetos.","El viaje y sus pruebas.","El papel de los dioses, el destino y la fama.","Y cómo la épica llega hasta los relatos de hoy. ¡A practicar!"]}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAAGmWmUSEmHQmHQgJyRththGvV0mshNGDBskRqJrRe9huF1f+ToyC02hg///6byMgtJgMjEm0wf////TSaGX/6X///ILTaGX004k0IyeWEZk8rKZE6PKymOMDjf+ZMaTJoCIK3qna4wZVrGiZFAYMhZigSVgiJMpRNVxOmCMtoEd/mD+M//NkxIMYK41wAEhHXBHBHJ08R/mYI3+Pj5nwNiMD/9+twMz3gBEeB8EcZjv//7//Pb+jv//4AGYCSLw+wiBORLvHgH/85hc+5iRJP0s7///8A+Gkjh78NxY8cCYC4sDQOKkyl26il0aYSJ+d0meGVS+eaTuOXmKuqISV5a3SVH18tGncyQDU8YTOHkIzbmfk//NkxKUbOI4QAGGEjTHjLetRA3pU1cFe9FcAxJmCdGE0BBb80nJcDWomdZWThE+Ze5ReEUebKffKenP/p/fMjWqjMQI0Kgg9+eaEC/uIyWQzIofMcmaFmeGqSoZG3y+x1DhGlcZs721vJcysXY3/Vpl2Iln//bw1n/DlPJ+z/lJyM5Yf/zl8810+F2+RbVt3//NkxLscDDIgSkBHsCMy/LrZpwu+fl8t/lzOZ9Ms71u/HlkQuZNczz+yfPO0F1Gm
