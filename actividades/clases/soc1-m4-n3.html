ería de cobre y de *litio*, clave para las baterías de los celulares.","La *Pampa*: granos y carne que se exportan a todo el planeta."]},{"t":"antesdespues","antes":{"cab":"ANTES","emoji":"🌾","texto":"pastizales y venados de las pampas"},"despues":{"cab":"AHORA","emoji":"🚜","texto":"campos de soja, trigo y ganado"},"voz":["Así cambió la Pampa. Antes: un mar de *pastizales*, con venados y ñandúes.","Ahora: casi todo son *cultivos* y ganado. Es un ambiente natural, transformado por la sociedad."]},{"t":"pregunta","pregunta":"¿Para qué se usa sobre todo el litio de los Andes?","opciones":["Para baterías","Para construir casas","Para hacer vidrio"],"correcta":0,"voz":["Te toca: ¿para qué se usa sobre todo el litio de los Andes?","¿Para baterías, para construir casas, o para hacer vidrio?","*Para baterías*: celulares, computadoras y autos eléctricos."]},{"t":"errores","items":[{"mal":"La Amazonia es solo de Brasil","bien":"Se reparte en nueve países"},{"mal":"Ambiente = solo naturaleza","bien":"Naturaleza + sociedad"}],"voz":["Errores típicos.","Creer que la Amazonia es solo de Brasil: se reparte en *nueve países*.","Y olvidar que un ambiente es naturaleza *y* sociedad: la Pampa de hoy la hicieron, en gran parte, las personas."]},{"t":"resumen","voz":["Repasemos.","La *Amazonia*: la selva más grande del mundo.","Los *Andes*: cordillera, cobre y litio.","*Atacama*: el desierto no polar más seco.","Y la *Pampa*: pastizales transformados en campos.","¡Clase terminada! Ahora, *a practicar*."],"items":[["AMAZONIA","selva más grande"],["ANDES","cordillera y minería"],["ATACAMA","desierto más seco"],["PAMPA","pastizales hechos campos"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.MAPAS={"sudamerica":{"s":476.4611514305989,"t":[1282.31731931782,119.16350593473865],"paises":{"Fiji":"M2764,267L2766,266L2769,268L2767,273L2762,274L2757,273L2757,269L2760,266ZM2779,259L2774,261L2769,263L2767,260L2772,258L2774,257L2779,255L2779,255L2779,259ZM-215,255L-21
