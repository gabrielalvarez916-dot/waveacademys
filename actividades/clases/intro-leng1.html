ar cualquier oración completa."]},{"t":"pasos","titulo":"CÓMO SE JUEGA CADA NIVEL","items":[{"txt":"Mirá la clase animada","emoji":"🎬"},{"txt":"Hacé la lección interactiva","emoji":"🧠"},{"txt":"Practicá con las actividades","emoji":"🧩"},{"txt":"En algunas misiones, leé el libro del nivel","emoji":"📖"}],"voz":["¿Cómo se juega? Cada misión tiene *niveles*.","Primero mirás una *clase animada*, como esta.","Después hacés la *lección interactiva*: explica, te muestra ejemplos paso a paso y te hace practicar.","Y resolvés las *actividades* para sumar puntos.","En algunas misiones hay un *libro del nivel*: lo bajás desde el principio de la misión, lo leés y al final hacés sus actividades. Este año leés *La liga de los pelirrojos* y *El fantasma de Canterville*."]},{"t":"frase","texto":"Al final de cada misión te espera el NIVEL JEFE","emoji":"👑","color":"#F4B63F","voz":["Y al final de cada misión te espera el *nivel jefe*: el desafío para pasar a la siguiente."]},{"t":"consejo","titulo":"UN CONSEJO","texto":"Leé todos los días, aunque sean diez minutos","emoji":"📚","voz":["Un consejo: *leé todos los días*, aunque sean diez minutos. Así se forma un gran lector."]},{"t":"frase","texto":"Misión 1: la comunicación. ¡Vamos!","emoji":"🚀","voz":["¿Listo? Tu primera misión te espera: *la comunicación y el lenguaje*. ¡Vamos!"]}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAACA1U1NSkiHDhk0NxaCacXDtKSgw8gTMLqd2Lh2fczYMjabQy//tp/////////+0mv/7Sa/////98gsQM6PKymaOlimROlisJHHEC0LVTLP0sqqqqIDKoyqwYgNk64DHwLCzEgAgUAFE9gxDmSTkHJNiICThh/4GfAPuyW8PeYPgbsf+//NkxIMWa5V4JDBHXfz/PAADhngAi4e/w//AM8A9JH9seI/3/8lzzPvg7//xHwH/mkd5FIj4ZAdx1sHfHgA/CLUfpF9xB8AyA4eIDx4kiejqE3Azm2FDAbI62aNRRlJcqbEG+wG85CO4L7SczLUhnOCO0pbkV+/AAnP+exKjmdiJl1W06hIRmceL0+2l9M6V//NkxKwbEGIQAEmMAZwyMy4qsROhCtPyLc1zTN9yPPKYM98+f9w/mebRImf5G7lyrEKlkQP/DxNw+Ze/g3XP3w+HBag/IWGbV+BkL+aY7NACD4IBlOHtscZEIGCVjqf9Q7SrQe3Y4RfzONmSVfnzkypHlCGGyRn8sj3/Oc52cVe1CtsPmdh4xZtC86f3l59u//NkxMIeg8YYAHpGEZ/EspF3yuSZT/fz5+X9tme3/uth3ymWX/Td3Kjh942MZM1
