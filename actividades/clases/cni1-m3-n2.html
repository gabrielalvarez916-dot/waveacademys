ad + ambiente"},{"cab":"BIOSFERA","txt":"todos los ecosistemas"}],"voz":["Y hacia afuera los niveles siguen.","*Población*: individuos de la misma especie en un lugar, como los carpinchos de una laguna.","*Comunidad*: todas las poblaciones que viven juntas.","*Ecosistema*: la comunidad más el ambiente: agua, suelo, luz.","*Biosfera*: todos los ecosistemas del planeta."]},{"t":"pregunta","pregunta":"El corazón, ¿qué nivel de organización es?","opciones":["Tejido","Sistema","Órgano"],"correcta":2,"voz":["Te toca: el corazón, ¿qué nivel es?","¿tejido, sistema, o órgano?","*Órgano*: está formado por varios tejidos. El *sistema* circulatorio incluye al corazón, las venas y las arterias."]},{"t":"errores","items":[{"mal":"Tejido = órgano","bien":"Varios tejidos forman un órgano"},{"mal":"Población = comunidad","bien":"Población: una sola especie"}],"voz":["Errores típicos.","Confundir *tejido* con *órgano*.","Y *población* con *comunidad*: la población es de *una sola especie*."]},{"t":"resumen","voz":["Repasemos.","La unidad: la *célula*.","En el cuerpo: *tejido, órgano y sistema*.","Afuera: *población y comunidad*.","Y el *ecosistema* y la *biosfera*.","¡Clase terminada! Ahora, *a practicar*."],"items":[["UNIDAD","la célula"],["CUERPO","tejido, órgano, sistema"],["AFUERA","población, comunidad"],["TODO","ecosistema y biosfera"]],"fin":{"titulo":"¡CLASE TERMINADA!","sub":"Ahora, a practicar 🚀"}}]};window.VOZ_AUDIO=[[{"a":"//NkxAAAAANIAAAAABJlFYYWLR0BhlFDDCxDpWUzR0sUyJ0eKxDjo6WKxDOjysRmjysrEMOIC01iocNmTMzzJh/NP9ZA04VEIcNgMIiqDP80ZWKmjY0VQaMgNxkxzJr//kDThUVDhsBhFnmnqlJYCBs3wAQ4HICoTq58RPicL3NziFufE+ufU679f65pxKVi//NkxIMXyS1YAAjGBHxEc9zrxH+ABO+7u5/dz80SuiJ/T39EQnfiF/EiF/6GEEF8RHeu59cv367on/E9ziInv/on/6IhZaIiV3LSu7nv/6CPAJ/4/+AAGHh8CgeEQyXgUHT2eW0wVjyCGbqGt5aHsec+pZbl2kEIzMKCBp32e+bLcMiRaEGoclW1LVXOkfS0//NkxKYcI8oEykhGDY/DoMWHKzp6IFA08IMZzbe6rGxM/I5T20K9PZ+sxr7dowmeTiIzbasa4ezSokslu5D20BqOd3ZSsu/mZLlRXfr2coxrWxmG6cvSiu1FrdvCXMLVH+fH77jleXMzJVoKCW0tgqnFhpRvWurX+rMNKXvn06uM1+s
