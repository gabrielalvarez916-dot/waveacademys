<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#087E83">
  <meta name="robots" content="noindex">
  <title>Wave Academy's · Elegí tu contraseña</title>
  <link rel="icon" href="/assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="entrada cambio">

  <main class="tarjeta">
    <img class="logo" src="/assets/logo.png" alt="Wave Academy's" width="800" height="476">

    <h1>Elegí tu contraseña</h1>
    <p class="bajada">Es tu primer ingreso. Creá una contraseña propia para continuar.</p>

    <form id="form-clave" novalidate>
      <div class="campo">
        <label for="nueva">Contraseña nueva</label>
        <div class="con-ojo">
          <input id="nueva" name="nueva" type="password" placeholder="Mínimo 8 caracteres"
                 autocomplete="new-password" required>
          <button type="button" class="ojo" aria-label="Mostrar contraseña">
            <svg class="i-ver" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-ocultar" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A16.6 16.6 0 0 0 2 12s3.6 7 10 7a10.6 10.6 0 0 0 4.4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>

      <div class="campo">
        <label for="repetir">Repetí la contraseña</label>
        <div class="con-ojo">
          <input id="repetir" name="repetir" type="password" placeholder="Escribila otra vez"
                 autocomplete="new-password" required>
          <button type="button" class="ojo" aria-label="Mostrar contraseña">
            <svg class="i-ver" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="i-ocultar" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.7 10.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A16.6 16.6 0 0 0 2 12s3.6 7 10 7a10.6 10.6 0 0 0 4.4-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
          </button>
        </div>
      </div>

      <p id="mensaje" class="mensaje" role="alert" hidden></p>

      <button id="btn-guardar" class="boton" type="submit">Guardar y continuar</button>
    </form>

    <button id="btn-salir" class="enlace" type="button">Salir</button>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/cambiar-clave.js"></script>
</body>
</html>
