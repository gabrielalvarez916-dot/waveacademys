<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión ℕ</title>
<style>
:root{--bg:#0c1f21;--bg2:#123336;--card:#17383b;--card2:#1e474b;--linea:#2c5a5e;--aqua:#7FD3C4;--tq:#19a39f;--sol:#F4B63F;--coral:#ff7a66;--txt:#eaf7f4;--suave:#9dbdb9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:radial-gradient(1200px 700px at 80% -10%,#1b5a5c 0%,transparent 60%),radial-gradient(900px 600px at -10% 110%,#16484b 0%,transparent 55%),var(--bg);color:var(--txt);overflow:hidden;user-select:none;-webkit-user-select:none}
#app{position:relative;height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column;padding:12px 16px 16px}
.hud{display:flex;align-items:center;gap:10px;font-weight:800;font-size:.9rem;min-height:40px}
.hud .pasos{display:flex;gap:6px;flex:1}
.hud .pasos i{flex:1;height:8px;border-radius:9px;background:var(--linea);overflow:hidden;position:relative}
.hud .pasos i b{position:absolute;inset:0;width:0;background:linear-gradient(90deg,var(--tq),var(--aqua));border-radius:9px;transition:width .4s}
.chip{background:var(--card);border:1px solid var(--linea);border-radius:999px;padding:6px 12px;white-space:nowrap}
.chip.racha{color:var(--sol)}.chip.racha.off{opacity:.35}
.escena{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:14px;animation:entra .35s ease both}
@keyframes entra{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.etq{font-size:.72rem;letter-spacing:.28em;font-weight:900;color:var(--aqua);text-transform:uppercase}
h1{font-size:clamp(1.6rem,6vw,2.6rem);line-height:1.1;margin:4px 0;font-weight:900}
h2{font-size:clamp(1.15rem,4.4vw,1.55rem);line-height:1.25;margin:0;font-weight:900;text-wrap:balance}
p{margin:0;color:var(--suave);font-weight:600;line-height:1.45}
.mat{font-family:"Cambria Math","STIX Two Math","Latin Modern Math","Times New Roman",serif;font-weight:400}
.op .mat,.fb .mat,h2 .mat{font-size:1.22em}
svg.N{height:.82em;width:auto;vertical-align:-.02em;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round}
.btn{appearance:none;border:0;border-radius:16px;font:inherit;font-weight:900;font-size:1.05rem;padding:15px 20px;min-height:54px;color:#06282a;background:linear-gradient(180deg,#9be8da,var(--aqua));box-shadow:0 5px 0 #3e9488;cursor:pointer;transition:transform .08s,box-shadow .08s,opacity .2s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #3e9488}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn.sec{background:var(--card2);color:var(--txt);box-shadow:0 5px 0 #0e2a2c;border:1px solid var(--linea)}
.ops{display:grid;gap:10px}
.ops.dos{grid-template-columns:1fr 1fr}
.op{appearance:none;font:inherit;font-weight:800;font-size:clamp(1rem,4vw,1.25rem);text-align:center;color:var(--txt);background:var(--card);border:2px solid var(--linea);border-radius:16px;padding:14px;min-height:58px;cursor:pointer;transition:transform .1s,border-color .15s,background .15s}
.op:active{transform:scale(.97)}
.op.sel{border-color:var(--aqua);background:#1f5054}
.op.bien{border-color:var(--aqua);background:#1d5a55;color:#d8fff7;animation:pop .35s}
.op.mal{border-color:var(--coral);background:#4a2a28;animation:temblar .35s}
.op.gris{opacity:.45}
.op.si{border-color:#2f7f78}.op.no{border-color:#7a4a44}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes temblar{25%{transform:translateX(-7px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
.tarjeta{background:linear-gradient(160deg,var(--card2),var(--card));border:1px solid var(--linea);border-radius:22px;padding:22px 16px;text-align:center;font-size:clamp(1.9rem,9vw,3.2rem);font-weight:900;min-height:118px;display:grid;place-items:center;box-shadow:0 14px 30px -18px #000}
.tarjeta.chica{font-size:clamp(1.3rem,6vw,2rem)}
.tiempo{height:8px;border-radius:9px;background:var(--linea);overflow:hidden}
.tiempo b{display:block;height:100%;width:100%;background:var(--sol);border-radius:9px}
.fb{position:absolute;left:16px;right:16px;bottom:16px;border-radius:18px;padding:14px 16px;font-weight:800;display:flex;gap:12px;align-items:center;transform:translateY(140%);transition:transform .28s cubic-bezier(.2,1.2,.4,1);z-index:5;box-shadow:0 18px 40px -12px #000}
.fb.ver{transform:none}
.fb.bien{background:#1d6b63;border:2px solid var(--aqua)}
.fb.mal{background:#5a2f2b;border:2px solid var(--coral)}
.fb div{flex:1;line-height:1.35}.fb small{display:block;font-weight:600;opacity:.92;margin-top:2px}
.fb .btn{padding:10px 16px;min-height:44px;font-size:.95rem}
/* nivel 1 */
.ranuras{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:70px;padding:12px;border:2px dashed var(--linea);border-radius:18px;background:rgba(0,0,0,.18)}
.ranuras:empty::before{content:"Tocá las piezas en orden";color:var(--suave);font-weight:700;align-self:center}
.piezas{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.pz{appearance:none;font:inherit;font-size:clamp(1.3rem,6vw,1.9rem);font-weight:800;color:var(--txt);background:var(--card2);border:2px solid var(--linea);border-bottom-width:5px;border-radius:14px;min-width:54px;min-height:56px;padding:6px 14px;cursor:pointer}
.pz.usada{visibility:hidden}
.ranuras .pz{border-color:var(--aqua)}
/* recta */
.recta{position:relative;height:120px;margin:10px 6px}
.recta .eje{position:absolute;left:0;right:14px;top:50px;height:4px;background:var(--suave);border-radius:4px}
.recta .eje::after{content:"";position:absolute;right:-14px;top:-7px;border-left:16px solid var(--suave);border-top:9px solid transparent;border-bottom:9px solid transparent}
.pt{position:absolute;top:30px;width:44px;height:44px;margin-left:-22px;border-radius:50%;border:0;background:none;cursor:pointer;padding:0}
.pt::before{content:"";position:absolute;left:12px;top:12px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:4px solid var(--aqua);transition:transform .12s,background .15s}
.pt:active::before{transform:scale(1.25)}
.pt.bien::before{background:var(--aqua);transform:scale(1.3)}.pt.mal::before{background:var(--coral);border-color:var(--coral)}
.pt span{position:absolute;left:0;right:0;top:48px;text-align:center;font-weight:900;font-size:1.05rem;color:var(--txt)}
/* máquina */
.maq{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:900}
.bola{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;background:var(--card2);border:2px solid var(--aqua)}
.caja{width:84px;height:84px;border-radius:20px;display:grid;place-items:center;font-size:2.4rem;background:#0a1819;border:2px solid var(--linea);color:var(--aqua)}
.caja.gira{animation:gira .7s ease}
@keyframes gira{50%{transform:scale(1.12) rotate(8deg);border-color:var(--sol)}}
.bola.res{background:var(--linea);border-style:dashed;color:var(--suave)}
.bola.res.nat{background:var(--tq);border:2px solid var(--aqua);color:#fff;animation:pop .4s}
.bola.res.nonat{background:var(--coral);border:2px solid #ffb3a6;color:#3a0f0a;animation:pop .4s}
.flecha{color:var(--suave);font-size:1.4rem}
/* mapa y final */
.mapa{display:grid;gap:10px}
.nodo{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--linea);border-radius:16px;padding:12px 14px;font-weight:800}
.nodo i{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-style:normal;background:var(--linea);color:var(--suave);font-weight:900;flex:none}
.nodo.hecho i{background:var(--aqua);color:#06282a}.nodo.act{border-color:var(--aqua);box-shadow:0 0 0 3px rgba(127,211,196,.18)}
.nodo.act i{background:var(--sol);color:#3a2a00}.nodo small{display:block;color:var(--suave);font-weight:600}
.nodo em{margin-left:auto;font-style:normal;color:var(--sol);letter-spacing:2px}
.gran{font-size:clamp(3rem,16vw,5rem);font-weight:900;line-height:1;background:linear-gradient(90deg,var(--aqua),#d9fff7);-webkit-background-clip:text;background-clip:text;color:transparent}
.estrellas{font-size:2.4rem;letter-spacing:8px;color:var(--sol)}.estrellas s{text-decoration:none;opacity:.2}
.centro{text-align:center;align-items:center}
.conf{position:absolute;inset:0;pointer-events:none;overflow:hidden}.conf i{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:cae linear forwards}
@keyframes cae{to{transform:translateY(110vh) rotate(720deg)}}
@media (max-height:560px){.escena{gap:8px}.tarjeta{min-height:80px;padding:12px}.recta{height:100px}}
</style></head><body><div id="app"></div>
<script>
(function(){
var app=document.getElementById('app');
var NN='<svg class="N" viewBox="0 0 20 22" aria-label="N"><path d="M3 20V2h3l10 18h1V2M3 2h0M6.2 2 16.4 20M3 20h3.2V7.6M14 2h3M14 2v12.2"/></svg>';
var N0=NN+'<sub style="font-size:.6em">0</sub>';
function M(t){return '<span class="mat">'+t.replace(/N0/g,N0).replace(/NN/g,NN)+'</span>'}
var NIVELES=[
 {nom:'Armá el conjunto',sub:'La escritura con llaves'},
 {nom:'¿Entra o no entra?',sub:'Pertenece y no pertenece'},
 {nom:'La recta numérica',sub:'Antecesor, sucesor y orden'},
 {nom:'El debate del cero',sub:'ℕ y ℕ₀'},
 {nom:'La máquina de cierre',sub:'¿Sale un natural?'}];
var E={niv:0,paso:0,pts:0,max:0,racha:0,mejor:0,porNivel:[],okN:0,totN:0,enviado:false};
function baraja(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

// ---------- pasos de cada nivel ----------
function pasos(n){
 if(n===0)return[
  {t:'armar',q:'Armá el conjunto de los números naturales',piezas:['N','=','{','1, 2, 3, 4,','…','}'],extra:['(',')'],exp:'Va el nombre, el igual, la llave que abre, los elementos, los puntos suspensivos y la llave que cierra.'},
  {t:'op',q:'¿Cuál está bien escrito?',ops:[M('NN = {1, 2, 3, 4, …}'),M('NN = (1, 2, 3, 4, …)'),M('NN = {1, 2, 3, 4}'),M('NN = 1, 2, 3, 4, …')],ok:0,mezclar:1,exp:'Los elementos van entre llaves y con puntos suspensivos, porque la lista no termina.'},
  {t:'op',q:'¿Qué indican los puntos suspensivos en '+M('{1, 2, 3, …}')+'?',ops:['Que la lista sigue sin terminar','Que faltan tres números','Que el conjunto termina ahí'],ok:0,mezclar:1,exp:'Avisan que el conjunto continúa para siempre: es infinito.'}];
 if(n===1){var it=[['7',1,'Sirve para contar: es natural.'],['−3',0,'Los negativos no son naturales.'],['0,5',0,'Los decimales no son naturales.'],['100',1,'Es natural.'],['½',0,'Las fracciones no son naturales.'],['1.000.000',1,'Por más grande que sea, es natural.'],['0',0,'En esta materia, '+M('NN')+' no incluye el cero. Para incluirlo usamos '+M('N0')+'.'],['−10',0,'Los negativos no son naturales.'],['15',1,'Es natural.'],['2,75',0,'Los decimales no son naturales.']];
  return baraja(it).slice(0,8).map(function(x){return{t:'op',tiempo:8,q:'¿Pertenece al conjunto '+M('NN')+'?',tarjeta:x[0],ops:[M('∈')+' Pertenece',M('∉')+' No pertenece'],dos:1,ok:x[1]?0:1,exp:x[2]}})}
 if(n===2)return[
  {t:'recta',q:'Tocá el punto que corresponde al <b>6</b>',meta:6,ver:[1,2],exp:'Los puntos están a la misma distancia: contás de a uno desde el 1.'},
  {t:'recta',q:'Tocá el <b>sucesor</b> de 4',meta:5,ver:'todos',exp:'El sucesor es el que sigue: 4 + 1 = 5.'},
  {t:'recta',q:'Tocá el <b>antecesor</b> de 9',meta:8,ver:'todos',exp:'El antecesor es el anterior: 9 − 1 = 8.'},
  {t:'op',q:'¿Qué número natural <b>no tiene</b> antecesor en '+M('NN')+'?',ops:['El 1','El 0','El 10','Todos tienen'],ok:0,exp:'El 1 es el primer elemento: no hay ningún natural antes.'},
  {t:'op',q:'En la recta numérica, el número mayor siempre queda…',ops:['Más a la derecha','Más a la izquierda','En el medio'],ok:0,mezclar:1,exp:'Los números crecen hacia la derecha.'}];
 if(n===3)return[
  {t:'op',q:'¿Qué conjunto es este?',tarjeta:M('{1, 2, 3, 4, …}'),chica:1,ops:[M('NN'),M('N0'),'Ninguno de los dos'],ok:0,exp:'Empieza en 1 y sigue sin fin: es '+M('NN')+'.'},
  {t:'op',q:'¿Qué conjunto es este?',tarjeta:M('{0, 1, 2, 3, …}'),chica:1,ops:[M('NN'),M('N0'),'Ninguno de los dos'],ok:1,exp:'Incluye el cero: es '+M('N0')+', "ene sub cero".'},
  {t:'op',q:'¿Qué conjunto es este?',tarjeta:M('{0, 1, 2, 3}'),chica:1,ops:[M('NN'),M('N0'),'Ninguno de los dos'],ok:2,exp:'No tiene puntos suspensivos: termina en 3, así que no es ninguno de los dos.'},
  {t:'op',q:'¿Verdadero o falso?',tarjeta:M('0 ∈ N0'),chica:1,ops:['Verdadero','Falso'],dos:1,ok:0,exp:'El cero pertenece a '+M('N0')+'.'},
  {t:'op',q:'¿Por qué algunos libros incluyen el cero en '+M('NN')+' y otros no?',ops:['Porque es una convención: un acuerdo','Porque unos están equivocados','Porque el cero no existe'],ok:0,mezclar:1,exp:'No hay una única respuesta: depende de la convención que use cada material.'}];
 var ops=[[8,'+',5,13],[5,'−',8,-3],[6,'·',7,42],[7,':',2,'3,5'],[20,':',4,5],[12,'−',12,0],[9,'·',9,81],[3,'−',10,-7]];
 var l=baraja(ops).slice(0,6).map(function(o){var nat=typeof o[3]==='number'&&o[3]>0;return{t:'maq',q:'¿Sale un número natural?',a:o[0],op:o[1],b:o[2],r:String(o[3]).replace('-','−'),ops:['Sí, es natural','No es natural'],dos:1,ok:nat?0:1,exp:nat?o[3]+' pertenece a '+M('NN')+'.':(o[3]===0?'Da 0, y en esta materia el cero no está en '+M('NN')+'.':String(o[3]).replace('-','−')+' no pertenece a '+M('NN')+'.')}});
 l.push({t:'multi',q:'¿Qué operaciones son <b>cerradas</b> en '+M('NN')+'? Marcá todas las correctas.',ops:['Suma','Resta','Multiplicación','División'],ok:[0,2],exp:'Sumar o multiplicar dos naturales siempre da un natural. Con la resta y la división, a veces no.'});
 return l}

// ---------- pantalla ----------
function hud(){var h='<div class="hud"><div class="pasos">';for(var i=0;i<5;i++)h+='<i><b style="width:'+(i<E.niv?100:i===E.niv?Math.round(E.paso/E.lista.length*100):0)+'%"></b></i>';
 return h+'</div><span class="chip racha'+(E.racha<2?' off':'')+'">🔥 '+E.racha+'</span><span class="chip">⭐ '+E.pts+'</span></div>'}
function pintar(html,cl){app.innerHTML=(E.lista?hud():'')+'<div class="escena '+(cl||'')+'">'+html+'</div><div class="fb"></div>'}
function fb(bien,exp,sig){var f=app.querySelector('.fb');f.className='fb ver '+(bien?'bien':'mal');
 f.innerHTML='<div>'+(bien?['¡Bien!','¡Exacto!','¡Así se hace!','¡Correcto!'][Math.floor(Math.random()*4)]:'Casi…')+'<small>'+exp+'</small></div><button class="btn">Seguir</button>';
 f.querySelector('button').onclick=sig}
function anotar(bien,valor){valor=valor||10;E.max+=valor;E.totN++;if(bien){E.racha++;E.mejor=Math.max(E.mejor,E.racha);E.pts+=valor+(E.racha>=3?2:0);E.okN++}else E.racha=0;
 var c=app.querySelectorAll('.chip');if(c[0]){c[0].textContent='🔥 '+E.racha;c[0].className='chip racha'+(E.racha<2?' off':'');c[1].textContent='⭐ '+E.pts}}
function siguiente(){E.paso++;if(E.paso>=E.lista.length)return finNivel();jugar()}
function jugar(){var s=E.lista[E.paso];({op:pOp,armar:pArmar,recta:pRecta,maq:pMaq,multi:pMulti})[s.t](s)}
function cab(s){return '<div><div class="etq">Nivel '+(E.niv+1)+' · '+NIVELES[E.niv].nom+'</div><h2>'+s.q+'</h2></div>'}

function pOp(s,extraHtml,alResolver){
 var orden=s.ops.map(function(_,i){return i});if(s.mezclar)orden=baraja(orden);
 var h=cab(s)+(extraHtml||'')+(s.tarjeta?'<div class="tarjeta'+(s.chica?' chica':'')+'">'+s.tarjeta+'</div>':'')+(s.tiempo?'<div class="tiempo"><b></b></div>':'')+'<div class="ops'+(s.dos?' dos':'')+'">';
 orden.forEach(function(i){h+='<button class="op" data-i="'+i+'">'+s.ops[i]+'</button>'});pintar(h+'</div>');
 var hecho=false,reloj=null;
 function resolver(i,btn){if(hecho)return;hecho=true;clearTimeout(reloj);var bien=i===s.ok;
  [].forEach.call(app.querySelectorAll('.op'),function(b){var k=+b.dataset.i;b.disabled=true;if(k===s.ok)b.classList.add('bien');else if(b===btn)b.classList.add('mal');else b.classList.add('gris')});
  var tb=app.querySelector('.tiempo b');if(tb){tb.style.transition='none';tb.style.width=getComputedStyle(tb).width}
  anotar(bien);if(alResolver)alResolver(bien);fb(bien,i<0?'Se acabó el tiempo. '+s.exp:s.exp,siguiente)}
 [].forEach.call(app.querySelectorAll('.op'),function(b){b.onclick=function(){resolver(+b.dataset.i,b)}});
 if(s.tiempo){var tb=app.querySelector('.tiempo b');requestAnimationFrame(function(){requestAnimationFrame(function(){tb.style.transition='width '+s.tiempo+'s linear';tb.style.width='0%'})});reloj=setTimeout(function(){resolver(-1,null)},s.tiempo*1000)}}

function pArmar(s){
 var todas=baraja(s.piezas.concat(s.extra)),puestas=[];
 function txt(p){return p==='N'?NN:p}
 function dib(){var h=cab(s)+'<div class="ranuras mat">'+puestas.map(function(i){return '<button class="pz" data-q="'+i+'">'+txt(todas[i])+'</button>'}).join('')+'</div><div class="piezas mat">'+todas.map(function(p,i){return '<button class="pz'+(puestas.indexOf(i)>=0?' usada':'')+'" data-p="'+i+'">'+txt(p)+'</button>'}).join('')+'</div><p style="text-align:center">Tocá una pieza para ponerla. Tocala arriba para sacarla. Ojo: sobran piezas.</p><button class="btn" id="ok"'+(puestas.length<3?' disabled':'')+'>Comprobar</button>';
  pintar(h);
  [].forEach.call(app.querySelectorAll('[data-p]'),function(b){b.onclick=function(){puestas.push(+b.dataset.p);dib()}});
  [].forEach.call(app.querySelectorAll('[data-q]'),function(b){b.onclick=function(){puestas.splice(puestas.indexOf(+b.dataset.q),1);dib()}});
  document.getElementById('ok').onclick=function(){var bien=puestas.map(function(i){return todas[i]}).join('|')===s.piezas.join('|');
   [].forEach.call(app.querySelectorAll('.pz,#ok'),function(b){b.disabled=true});app.querySelector('.ranuras').style.borderColor=bien?'var(--aqua)':'var(--coral)';
   anotar(bien,20);fb(bien,(bien?'':'Lo correcto es '+M('NN = {1, 2, 3, 4, …}')+'. ')+s.exp,siguiente)}}
 dib()}

function pRecta(s){
 var h=cab(s)+'<div class="recta"><div class="eje"></div>';
 for(var i=1;i<=10;i++){var ver=s.ver==='todos'||s.ver.indexOf(i)>=0;h+='<button class="pt" style="left:'+((i-1)/9.6*100)+'%" data-n="'+i+'"><span>'+(ver?i:'')+'</span></button>'}
 pintar(h+'</div><p style="text-align:center">Tocá un punto de la recta.</p>');var hecho=false;
 [].forEach.call(app.querySelectorAll('.pt'),function(b){b.onclick=function(){if(hecho)return;hecho=true;var n=+b.dataset.n,bien=n===s.meta;
  [].forEach.call(app.querySelectorAll('.pt'),function(x){x.querySelector('span').textContent=x.dataset.n;if(+x.dataset.n===s.meta)x.classList.add('bien')});if(!bien)b.classList.add('mal');
  anotar(bien);fb(bien,s.exp,siguiente)}})}

function pMaq(s){
 var m='<div class="maq"><div class="bola">'+s.a+'</div><div class="caja">'+s.op+'</div><div class="bola">'+s.b+'</div><span class="flecha">➜</span><div class="bola res">?</div></div>';
 pOp(s,m,function(bien){var c=app.querySelector('.caja'),r=app.querySelector('.res');c.classList.add('gira');setTimeout(function(){r.textContent=s.r;r.classList.add(s.ok===0?'nat':'nonat')},350)})}

function pMulti(s){
 var sel={};pintar(cab(s)+'<div class="ops dos">'+s.ops.map(function(o,i){return '<button class="op" data-i="'+i+'">'+o+'</button>'}).join('')+'</div><button class="btn" id="ok" disabled>Comprobar</button>');

function mapa(titulo,boton,alSeguir){
 var h='<div><div class="etq">Misión '+NN+'</div><h2>'+titulo+'</h2></div><div class="mapa">';
 NIVELES.forEach(function(n,i){var hecho=i<E.porNivel.length;h+='<div class="nodo'+(hecho?' hecho':i===E.porNivel.length?' act':'')+'"><i>'+(hecho?'✓':i+1)+'</i><div>'+n.nom+'<small>'+n.sub+'</small></div>'+(hecho?'<em class="estrellas" style="font-size:1rem">'+estrellas(E.porNivel[i])+'</em>':'')+'</div>'});
 var l=E.lista;E.lista=null;pintar(h+'</div><button class="btn">'+boton+'</button>');E.lista=l;app.querySelector('.escena .btn').onclick=alSeguir}

 try{window.parent.postMessage({tipo:'wave-resultado',puntaje:pct},'*')}catch(e){}}
